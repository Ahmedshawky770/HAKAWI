<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Hakawi light palette</title>
  <desc id="desc">The light theme of the same token set, showing where the amber and aqua values deepen so they can carry text.</desc>
  <rect width="900" height="470" fill="#faf6ee"/>

  <text x="28" y="42" font-family="Georgia, serif" font-size="22" fill="#2a2421">Hakawi — light palette</text>
  <text x="28" y="64" font-family="system-ui, sans-serif" font-size="13" fill="#6b6560">canvas #faf6ee · the accent splits into hue, text-safe ink and fill</text>

  <text x="28" y="98" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#6f6963">SURFACES</text>
  <g font-family="system-ui, sans-serif" font-size="12">
    <rect x="28" y="110" width="200" height="86" rx="10" fill="#faf6ee" stroke="#e8e4de"/>
    <text x="44" y="136" fill="#2a2421">canvas</text>
    <text x="44" y="156" fill="#6b6560" font-size="11">#faf6ee</text>
    <text x="44" y="176" fill="#6f6963" font-size="10">Soft Cream Book-page</text>

    <rect x="244" y="110" width="200" height="86" rx="10" fill="#ffffff" stroke="#e8e4de"/>
    <text x="260" y="136" fill="#2a2421">surface</text>
    <text x="260" y="156" fill="#6b6560" font-size="11">#ffffff</text>
    <text x="260" y="176" fill="#6f6963" font-size="10">Warm White cards</text>

    <rect x="460" y="110" width="200" height="86" rx="10" fill="#f4efe6" stroke="#e8e4de"/>
    <text x="476" y="136" fill="#2a2421">surface-raised</text>
    <text x="476" y="156" fill="#6b6560" font-size="11">#f4efe6</text>
    <text x="476" y="176" fill="#6f6963" font-size="10">inputs, hovered rows</text>

    <rect x="676" y="110" width="196" height="86" rx="10" fill="#ffffff" stroke="#8a837b" stroke-width="2"/>
    <text x="692" y="136" fill="#2a2421">control-line</text>
    <text x="692" y="156" fill="#6b6560" font-size="11">#8a837b</text>
    <text x="692" y="176" fill="#6f6963" font-size="10">form borders · 3.27:1</text>
  </g>

  <text x="28" y="228" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#6f6963">INK</text>
  <g font-family="system-ui, sans-serif">
    <text x="28" y="258" font-size="26" fill="#2a2421">Dark Sepia</text>
    <text x="28" y="278" font-size="11" fill="#6b6560">--hk-ink #2a2421 · 15.30:1 on surface</text>
    <text x="330" y="258" font-size="20" fill="#6b6560">Medium Sepia</text>
    <text x="330" y="278" font-size="11" fill="#6f6963">--hk-ink-muted #6b6560 · 5.74:1</text>
    <text x="600" y="258" font-size="16" fill="#6f6963">Faint ink</text>
    <text x="600" y="278" font-size="11" fill="#6f6963">--hk-ink-faint #6f6963 · 5.03:1</text>
  </g>

  <text x="28" y="322" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#6f6963">WHY THE AMBER AND AQUA DEEPEN · THE HUE CANNOT CARRY TEXT</text>
  <g font-family="system-ui, sans-serif" font-size="12">
    <rect x="28" y="334" width="204" height="56" rx="12" fill="#e65100"/>
    <text x="46" y="357" font-size="13" fill="#ffffff">#e65100 · 3.79:1</text>
    <text x="46" y="376" font-size="10" fill="#ffffff">white on it — FAILS AA</text>

    <rect x="248" y="334" width="204" height="56" rx="12" fill="#c2410c"/>
    <text x="266" y="357" font-size="13" fill="#ffffff">#c2410c · 5.18:1</text>
    <text x="266" y="376" font-size="10" fill="#ffffff">accent-fill + on-accent</text>

    <rect x="468" y="334" width="204" height="56" rx="12" fill="#00b8d4"/>
    <text x="486" y="357" font-size="13" fill="#2a2421">#00b8d4 · 2.21:1</text>
    <text x="486" y="376" font-size="10" fill="#2a2421">as link text — FAILS AA</text>

    <rect x="688" y="334" width="184" height="56" rx="12" fill="#0e7490"/>
    <text x="706" y="357" font-size="13" fill="#ffffff">#0e7490 · 5.36:1</text>
    <text x="706" y="376" font-size="10" fill="#ffffff">chrome-ink</text>
  </g>

  <text x="28" y="424" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#6f6963">SEMANTIC</text>
  <g font-family="system-ui, sans-serif" font-size="12">
    <rect x="28" y="432" width="200" height="26" rx="13" fill="#047857" fill-opacity="0.1" stroke="#047857" stroke-opacity="0.3"/>
    <text x="46" y="449" fill="#047857">success-ink #047857</text>
    <rect x="244" y="432" width="200" height="26" rx="13" fill="#b45309" fill-opacity="0.1" stroke="#b45309" stroke-opacity="0.3"/>
    <text x="262" y="449" fill="#b45309">warning-ink #b45309</text>
    <rect x="460" y="432" width="200" height="26" rx="13" fill="#b91c1c" fill-opacity="0.1" stroke="#b91c1c" stroke-opacity="0.3"/>
    <text x="478" y="449" fill="#b91c1c">error-ink #b91c1c</text>
    <rect x="676" y="432" width="196" height="26" rx="13" fill="#1d4ed8" fill-opacity="0.1" stroke="#1d4ed8" stroke-opacity="0.3"/>
    <text x="694" y="449" fill="#1d4ed8">info-ink #1d4ed8</text>
  </g>
</svg>
