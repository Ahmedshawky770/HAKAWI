<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Hakawi type specimen</title>
  <desc id="desc">The four faces and their roles: Amiri for Arabic headings, Cairo as the heading fallback, IBM Plex Sans Arabic for Arabic body text, Inter for Latin.</desc>
  <rect width="900" height="420" fill="#0d0b0a"/>
  <text x="28" y="40" font-family="Georgia, serif" font-size="21" fill="#efece6">Typography</text>
  <text x="28" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#a8a49e">Four faces, one job each. The scale is 4px-derived; the measure is 65ch.</text>

  <line x1="28" y1="82" x2="872" y2="82" stroke="#2a2624"/>

  <text x="28" y="126" font-family="Amiri, Georgia, serif" font-size="38" fill="#efece6" font-weight="700" direction="rtl">حكاوي</text>
  <text x="180" y="112" font-family="system-ui, sans-serif" font-size="12" fill="#ff9100">Amiri · headings</text>
  <text x="180" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#a8a49e">font-arabic-heading · line-height 1.3</text>

  <text x="28" y="176" font-family="system-ui, sans-serif" font-size="15" fill="#a8a49e">Cairo · heading fallback, loaded with Amiri</text>

  <text x="28" y="228" font-family="'IBM Plex Sans Arabic', system-ui, sans-serif" font-size="19" fill="#efece6" direction="rtl">في الحارة القديمة، كانت الحكايات تُروى على ضوء السراج.</text>
  <text x="560" y="212" font-family="system-ui, sans-serif" font-size="12" fill="#ff9100">IBM Plex Sans Arabic</text>
  <text x="560" y="230" font-family="system-ui, sans-serif" font-size="11" fill="#a8a49e">font-arabic-body · 1.75 in chrome, 1.9 in prose</text>

  <text x="28" y="262" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#efece6">The long night, told in nine parts · 42 views</text>
  <text x="560" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#00e5ff">Inter</text>
  <text x="560" y="266" font-family="system-ui, sans-serif" font-size="11" fill="#a8a49e">font-latin · keeps mixed lines from alternating</text>

  <line x1="28" y1="292" x2="872" y2="292" stroke="#2a2624"/>

  <g font-family="system-ui, sans-serif">
    <text x="28" y="318" font-size="30" font-weight="700" fill="#efece6">3xl 30</text>
    <text x="150" y="318" font-size="24" font-weight="600" fill="#efece6">2xl 24</text>
    <text x="252" y="318" font-size="20" font-weight="600" fill="#efece6">xl 20</text>
    <text x="338" y="318" font-size="18" fill="#efece6">lg 18</text>
    <text x="414" y="318" font-size="16" fill="#efece6">base 16</text>
    <text x="502" y="318" font-size="14" fill="#a8a49e">sm 14</text>
    <text x="576" y="318" font-size="12" fill="#a8a49e">xs 12</text>
    <text x="28" y="338" font-size="11" fill="#85807a">page title</text>
    <text x="150" y="338" font-size="11" fill="#85807a">section</text>
    <text x="252" y="338" font-size="11" fill="#85807a">card title</text>
    <text x="338" y="338" font-size="11" fill="#85807a">reading</text>
    <text x="414" y="338" font-size="11" fill="#85807a">body, controls</text>
    <text x="502" y="338" font-size="11" fill="#85807a">metadata</text>
    <text x="576" y="338" font-size="11" fill="#85807a">captions</text>
  </g>

  <rect x="28" y="356" width="844" height="48" rx="10" fill="#1a1615" stroke="#2a2624"/>
  <rect x="44" y="372" width="240" height="8" rx="4" fill="#241f1d"/>
  <text x="304" y="380" font-family="system-ui, sans-serif" font-size="11" fill="#a8a49e">measure capped at 65ch — the shaded run is the full line, the fill is where the text ends</text>
  <text x="44" y="398" font-family="system-ui, sans-serif" font-size="10" fill="#85807a">font-display: swap · Arabic subset · one stylesheet, no icon font</text>
</svg>
