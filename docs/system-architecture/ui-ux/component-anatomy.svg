<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Hakawi component anatomy</title>
  <desc id="desc">The button variants and states, a story card with its measured parts, the reaction row, and the four states every list must have.</desc>
  <rect width="960" height="520" fill="#0d0b0a"/>
  <text x="28" y="36" font-family="Georgia, serif" font-size="20" fill="#efece6">Component anatomy</text>
  <text x="28" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#a8a49e">Every box is drawn with the tokens it uses, not with approximations.</text>

  <!-- BUTTONS -->
  <text x="28" y="92" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#85807a">BUTTON · components/ui/Button.tsx</text>
  <g font-family="system-ui, sans-serif" font-size="13">
    <rect x="28" y="104" width="150" height="44" rx="12" fill="#ff9100"/>
    <text x="103" y="131" fill="#0d0b0a" text-anchor="middle" font-weight="600">اكتب قصة</text>
    <text x="103" y="164" class="" fill="#85807a" font-size="10" text-anchor="middle">primary · min-h-11</text>

    <rect x="192" y="104" width="150" height="44" rx="12" fill="#241f1d" stroke="#3a3532"/>
    <text x="267" y="131" fill="#efece6" text-anchor="middle">إلغاء</text>
    <text x="267" y="164" fill="#85807a" font-size="10" text-anchor="middle">secondary</text>

    <rect x="356" y="104" width="120" height="44" rx="12" fill="none"/>
    <text x="416" y="131" fill="#a8a49e" text-anchor="middle">إغلاق</text>
    <text x="416" y="164" fill="#85807a" font-size="10" text-anchor="middle">ghost</text>

    <rect x="490" y="104" width="120" height="44" rx="12" fill="#ef4444"/>
    <text x="550" y="131" fill="#0d0b0a" text-anchor="middle" font-weight="600">إزالة</text>
    <text x="550" y="164" fill="#85807a" font-size="10" text-anchor="middle">danger</text>

    <rect x="624" y="104" width="150" height="44" rx="12" fill="#241f1d" stroke="#ff9100" stroke-opacity="0.4"/>
    <text x="699" y="124" fill="#ff9100" text-anchor="middle">جارٍ الحفظ</text>
    <circle cx="669" cy="119" r="6" fill="none" stroke="#ff9100" stroke-width="2" stroke-dasharray="20 12"/>
    <text x="699" y="164" fill="#85807a" font-size="10" text-anchor="middle">loading · aria-busy</text>

    <rect x="788" y="104" width="44" height="44" rx="12" fill="#241f1d" stroke="#2a2624"/>
    <circle cx="810" cy="126" r="7" fill="none" stroke="#efece6" stroke-width="2"/>
    <text x="810" y="164" fill="#85807a" font-size="10" text-anchor="middle">icon · needs a label</text>
  </g>

  <!-- STORY CARD -->
  <text x="28" y="200" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#85807a">STORY CARD · components/story/StoryCard.tsx</text>
  <g font-family="system-ui, sans-serif">
    <rect x="28" y="212" width="420" height="256" rx="12" fill="#1a1615" stroke="#2a2624"/>
    <rect x="44" y="228" width="388" height="112" rx="8" fill="#241f1d"/>
    <text x="238" y="288" fill="#85807a" font-size="11" text-anchor="middle">cover 16:9 · 192px tall · lazy</text>
    <text x="44" y="368" font-size="20" font-weight="700" fill="#efece6">ليلة في الحارة</text>
    <text x="44" y="392" font-size="13" fill="#a8a49e">مقتطف من القصة، أربعة أسطر على الأكثر…</text>
    <text x="44" y="424" font-size="12" fill="#a8a49e">بواسطة أحمد محمد · خيال · ٣ أكتوبر</text>
    <text x="44" y="450" font-size="13" fill="#ff9100">❤ ٤٢</text>
    <text x="150" y="450" font-size="13" fill="#a8a49e">👁 ١٫٥ ألف</text>

    <g font-size="11" fill="#85807a">
      <text x="470" y="240">p-5 · rounded-xl · border-line</text>
      <text x="470" y="264">cover fills the width, 16:9</text>
      <text x="470" y="288">title text-xl, ink</text>
      <text x="470" y="312">excerpt text-sm, line-clamp-4</text>
      <text x="470" y="336">byline · category · date</text>
      <text x="470" y="360">counts in hk-numeric</text>
      <text x="470" y="384" fill="#efece6">hover: chrome glow, 200ms</text>
      <text x="470" y="408" fill="#efece6">focus: 2px amber outline</text>
      <text x="470" y="432" fill="#efece6">whole card is one link</text>
    </g>
  </g>

  <!-- REACTIONS -->
  <text x="700" y="200" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#85807a">REACTIONS</text>
  <g font-family="system-ui, sans-serif" font-size="13">
    <rect x="700" y="212" width="46" height="32" rx="16" fill="#1a1615" stroke="#2a2624"/>
    <text x="723" y="233" fill="#a8a49e" text-anchor="middle">❤ ٤٢</text>
    <rect x="756" y="212" width="46" height="32" rx="16" fill="#ff9100" fill-opacity="0.12" stroke="#ff9100" stroke-opacity="0.4"/>
    <text x="779" y="233" fill="#ff9100" text-anchor="middle" font-weight="600">💛 ٧</text>
    <rect x="812" y="212" width="46" height="32" rx="16" fill="#1a1615" stroke="#2a2624"/>
    <text x="835" y="233" fill="#a8a49e" text-anchor="middle">✨ ٣</text>
    <text x="700" y="270" font-size="11" fill="#85807a">pressed: accent border + fill + animate-beat</text>
    <text x="700" y="288" font-size="11" fill="#85807a">aria-pressed · label carries the total</text>
    <text x="700" y="306" font-size="11" fill="#85807a">six types, from REACTION_TYPES</text>
  </g>

  <!-- FOUR STATES -->
  <text x="700" y="346" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#85807a">EVERY LIST HAS FOUR STATES</text>
  <g font-family="system-ui, sans-serif">
    <rect x="700" y="358" width="230" height="46" rx="10" fill="#1a1615" stroke="#2a2624"/>
    <rect x="712" y="368" width="40" height="26" rx="6" fill="#241f1d"/>
    <rect x="760" y="374" width="110" height="8" rx="4" fill="#241f1d"/>
    <text x="880" y="380" font-size="11" fill="#a8a49e">loading</text>
    <text x="880" y="394" font-size="10" fill="#85807a">skeleton</text>

    <rect x="700" y="412" width="230" height="46" rx="10" fill="#1a1615" stroke="#3a3532" stroke-dasharray="5 4"/>
    <text x="716" y="440" font-size="11" fill="#a8a49e">empty · names what is missing</text>

    <rect x="700" y="466" width="230" height="42" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-opacity="0.4"/>
    <text x="716" y="492" font-size="11" fill="#f87171">error · role=alert · retry</text>
  </g>

  <text x="28" y="496" font-family="system-ui, sans-serif" font-size="11" fill="#85807a">A skeleton is never announced: the loading state is announced once, by the status region that owns it.</text>
</svg>
