name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

# WHY `cancel-in-progress: false`. The same reasoning as production: a second push used to kill a
# rollout that was already in flight, leaving the release half-applied with no rollback step run,
# because the job was cancelled rather than failed.
concurrency:
  group: deploy-staging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  # WHY the cluster name is a workflow-level variable: `modules/eks` names the cluster
  # `${var.environment}-hakawi` (terraform's own `eks_cluster_name` output), while the
  # workflows, docs and infrastructure/scripts/setup-iam.sh all say `hakawi-<env>-eks`. The
  # preflight below uses this constant to say which cluster it checked; the post-apply
  # kubeconfig uses the authoritative terraform output instead of any constant.
  EKS_CLUSTER_NAME: hakawi-staging-eks
  # Paymob credentials. WHY as TF_VAR_* and not in tfvars: `environments/staging/terraform.tfvars`
  # leaves them empty, and modules/secrets makes an empty Paymob credential FAIL THE APPLY for
  # every environment except dev (preconditions on the aws_secretsmanager_secret.paymob_*
  # resources) because backend/src/config/paymob.config.ts refuses to boot on an empty key —
  # i.e. an empty value here used to ship a CrashLoopBackOff release. They are `sensitive`, so
  # neither GitHub nor terraform prints them.
  TF_VAR_paymob_api_key: ${{ secrets.PAYMOB_API_KEY }}
  TF_VAR_paymob_merchant_id: ${{ secrets.PAYMOB_MERCHANT_ID }}
  TF_VAR_paymob_integration_id: ${{ secrets.PAYMOB_INTEGRATION_ID }}
  TF_VAR_paymob_webhook_secret: ${{ secrets.PAYMOB_HMAC_SECRET }}

jobs:
  # WHY THIS JOB EXISTS. Nothing ran before the deploy steps, so a red commit deployed.
  # `uses: ./.github/workflows/ci.yml` makes the whole CI file a required job of this one, and
  # every job below names it in `needs:`.
  #
  # No `secrets: inherit`: `ci.yml` reads none.
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [ci]
    outputs:
      backend-image: ${{ steps.backend-image.outputs.image }}
      frontend-image: ${{ steps.frontend-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/hakawi-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image
        id: backend-image
        run: |
          docker build -t $ECR_REGISTRY/hakawi/backend:${{ github.sha }} -f ./backend/Dockerfile .
          docker push $ECR_REGISTRY/hakawi/backend:${{ github.sha }}
          echo "image=$ECR_REGISTRY/hakawi/backend:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build, tag, and push frontend image
        id: frontend-image
        run: |
          docker build -t $ECR_REGISTRY/hakawi/frontend:${{ github.sha }} -f ./frontend/Dockerfile .
          docker push $ECR_REGISTRY/hakawi/frontend:${{ github.sha }}
          echo "image=$ECR_REGISTRY/hakawi/frontend:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy-staging:
    name: Deploy to Staging
    needs: [ci, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/hakawi-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------------------------------------------------------------------
      # PREFLIGHTS — everything that can fail, fails here, before an apply or a rollout exists.
      #
      # WHY THESE STEPS SIT BEFORE THE APPLY. This environment sets
      # `eks_cluster_endpoint_public_access_cidrs = []`
      # (infrastructure/terraform/environments/staging/terraform.tfvars) and this workflow runs
      # on `ubuntu-latest` — a GitHub-hosted runner OUTSIDE the VPC. Two problems used to be
      # discovered at the worst possible moment:
      #   1. the Kubernetes API answers nobody from here, so `update-kubeconfig` / `helm`
      #      timed out AFTER `terraform apply` had already closed the endpoint, mid-rollout;
      #   2. `aws_subnet.cidr_block` is ForceNew (infrastructure/terraform/modules/vpc/main.tf),
      #      so an apply against state holding the old overlapping `/28` database subnets plans
      #      a subnet destroy that fails while RDS still holds ENIs — a deploy red at
      #      "Deploy infrastructure" with an AWS error nobody can act on.
      # ---------------------------------------------------------------------------------------

      # WHY `kubectl auth can-i` and not `kubectl version` or `aws eks describe-cluster`: the
      # public access CIDRs are enforced by the API SERVER endpoint, and only an authenticated
      # Kubernetes API call proves this runner can reach it. `describe-cluster` goes to the EKS
      # control plane and succeeds even when the endpoint is closed, which is exactly why it is
      # not the test.
      #
      # `--allow-missing`: this is only right on the FIRST deploy of the environment, where the
      # cluster is created by the apply that follows and there is nothing to reach yet.
      - name: "Preflight: cluster reachability"
        run: node scripts/preflight-cluster-reachability.mjs --cluster "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}" --env staging --allow-missing

      # WHY BEFORE THE APPLY: planning first turns "apply fails with DependencyViolation half
      # way through" into "this deploy is blocked, here is the one-time migration".
      - name: "Preflight: subnet replacement guard"
        run: scripts/preflight-vpc-subnet-replacement.sh staging infrastructure/terraform

      - name: Deploy infrastructure to staging
        id: tf-apply
        run: |
          cd infrastructure/terraform
          terraform init -backend-config="key=hakawi/staging/terraform.tfstate"
          terraform apply -var-file="environments/staging/terraform.tfvars" -auto-approve

      - name: Capture terraform outputs
        id: tf-output
        run: |
          cd infrastructure/terraform
          echo "rds_primary_endpoint=$(terraform output -raw rds_primary_endpoint)" >> $GITHUB_OUTPUT
          echo "rds_primary_address=$(terraform output -raw rds_primary_address)" >> $GITHUB_OUTPUT
          echo "rds_replica_addresses=$(terraform output -json rds_replica_addresses | jq -r 'join(",")')" >> $GITHUB_OUTPUT
          echo "elasticache_primary_endpoint=$(terraform output -raw elasticache_primary_endpoint)" >> $GITHUB_OUTPUT
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          # SSOT for the two values this deploy used to hardcode: the cluster name (the module
          # names it `${var.environment}-hakawi`, and a wrong name here is a cluster-not-found
          # at update-kubeconfig) and the Secrets Manager prefix, which must equal the charts'
          # `externalSecrets.secretPrefix` or every ExternalSecret fails to sync.
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
          echo "secret_prefix=$(terraform output -raw secret_prefix)" >> $GITHUB_OUTPUT

      # WHY the name comes from terraform: modules/eks names the cluster
      # `${var.environment}-hakawi`, while this workflow said `hakawi-staging-eks`. Both
      # spellings exist in the repository, so the state is the tie-breaker.
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ steps.tf-output.outputs.eks_cluster_name }} --alias staging

      # ---------------------------------------------------------------------------------------
      # MIGRATION LEDGER PREFLIGHT. WHY before the migration Job AND before the two helm
      # upgrades: drizzle-kit used to apply this schema (`npx drizzle-kit migrate`, which stopped
      # at `0018_add_report_source` — 18 of 29 files) and keeps its own journal in
      # `__drizzle_migrations`, while the repository's runner keeps its ledger in
      # `drizzle_migrations` and ignores drizzle-kit's journal entirely. On an environment
      # previously migrated by drizzle-kit the runner's ledger is short, so it re-applies
      # `0019`–`0029` and dies on the unguarded `ALTER TABLE "reports" ADD CONSTRAINT` in
      # `migrations/0018_add_report_source.sql` — after the rollout has started.
      - name: "Preflight: migration ledger agreement"
        run: |
          set -euo pipefail
          # WHY jq and not `-o jsonpath`: the keys this preflight needs contain dots
          # (`db.user`, `db.password`), which a jsonpath expression can only reach through
          # escaping; `jq` indexes the map literally. WHY the ConfigMap and the
          # ExternalSecret-synced secret rather than tf outputs: those are exactly the values the
          # migration Job reads below, so the preflight checks the same database with the same
          # identity the job will use. Nothing is printed.
          CONFIG="$(kubectl get configmap hakawi-backend-config -n hakawi -o json)"
          SECRET="$(kubectl get secret hakawi-backend-secrets -n hakawi -o json)"

          export DB_PRIMARY_HOST="$(jq -r '.data.DB_PRIMARY_HOST // ""' <<<"$CONFIG")"
          export DB_PRIMARY_PORT="$(jq -r '.data.DB_PORT // "5432"' <<<"$CONFIG")"
          export DB_PRIMARY_NAME="$(jq -r '.data.DB_NAME // "hakawi"' <<<"$CONFIG")"
          export DB_USER="$(jq -r '.data["db.user"] // "" | @base64d' <<<"$SECRET")"
          export DB_PASSWORD="$(jq -r '.data["db.password"] // "" | @base64d' <<<"$SECRET")"

          if [ -z "$DB_PRIMARY_HOST" ]; then
            echo "::error::the release ConfigMap hakawi-backend-config carries no DB_PRIMARY_HOST, so the migration ledger preflight cannot reach the same primary the migration Job will use. Deploy the backend release once (or apply the chart) and re-run."
            exit 1
          fi
          if [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::the ExternalSecret-synced secret hakawi-backend-secrets has no db.user/db.password yet, so the migration ledger preflight cannot authenticate. Deploy the backend release once (or apply the chart) and re-run."
            exit 1
          fi
          node scripts/preflight-migration-ledger.mjs

      # ---------------------------------------------------------------------------------------
      # MIGRATIONS. What used to be here: `kubectl exec -n hakawi "$POD" -- npx drizzle-kit
      # migrate`, broken three ways over and silent about all of them.
      #
      #   1. It applied the drizzle journal, which listed 18 of the 29 `.sql` files in
      #      `migrations/`. MFA support (0029) and the books-owner backfills (0019, 0025) have
      #      never reached a database. See `migrations/meta/README.md`; `scripts/
      #      check-migration-journal.mjs` now fails a pull request when the index stops matching
      #      the files, and the journal has been completed.
      #   2. `drizzle-kit` is a devDependency and the runtime image installs `--omit=dev`
      #      (backend/Dockerfile), so the binary is not in the pod, and `npx` would have to fetch
      #      it into a container with `readOnlyRootFilesystem: true`.
      #   3. `$POD` was empty: `app.kubernetes.io/name=hakawi-staging-backend` matches nothing,
      #      because the chart sets that label to the chart name (`values.yaml:12`
      #      nameOverride: backend).
      #
      # What is here now: the repository's own runner in a DISPOSABLE JOB, because that is the only
      # place it can run. RDS is `publicly_accessible = false`
      # (infrastructure/terraform/modules/rds/main.tf:94), so a GitHub runner cannot reach the
      # database; and the image ships `dist/` without `src/` or the migration files, so the job
      # mounts `migrations/` from a ConfigMap and runs the compiled entry point the image already
      # contains. Locally verified against the compose `postgres-primary`:
      # `NODE_ENV=production node backend/dist/db/migrations/migration-runner.js up
      # --allow-production` reports all 29 applied after `npm run migration:run` does, and refuses
      # to run without the flag.
      #
      # WHY IT RUNS BEFORE THE TWO `helm upgrade` STEPS: it used to run after them, so the new
      # image went live BEFORE the schema it needs existed. A migration only the new code needs
      # (`0029_add_mfa_support`, the `0019`/`0025` backfills) then failed against an
      # already-rolled-out release — a broken release with the old image gone. The schema first,
      # the code second. Its failure aborts the rollout because it is a plain step with no
      # `continue-on-error`.
      - name: Apply migrations from the repository's own runner
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          CM="hakawi-migrations-${SHA}"
          JOB="hakawi-migrations-${SHA}"

          kubectl config use-context staging

          kubectl create configmap "${CM}" --from-file=migrations/ -n hakawi --dry-run=client -o yaml \
            | kubectl apply -f -

          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: hakawi
            labels:
              app.kubernetes.io/name: hakawi-migrations
              app.kubernetes.io/part-of: hakawi
              app.kubernetes.io/component: migration
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: hakawi-migrations
                  app.kubernetes.io/part-of: hakawi
                  app.kubernetes.io/component: migration
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${{ env.ECR_REGISTRY }}/hakawi/backend:${{ github.sha }}
                    imagePullPolicy: Always
                    # The compiled entry point, because the image has `dist/` and not `src/`, with
                    # module specifiers already rewritten to `.js` (verified in
                    # `backend/dist/db/migrations/migration-runner.js`).
                    #
                    # `up --allow-production` is the explicit-decision form the runner demands under
                    # `NODE_ENV=production` (migration-runner.ts:535-539); `verify` rejects that
                    # flag for any command but `up` (`parseMigrationArgv`), so the ledger check
                    # drops the variable instead.
                    command:
                      - sh
                      - -c
                      - |
                        set -e
                        node dist/db/migrations/migration-runner.js up --allow-production
                        env -u NODE_ENV node dist/db/migrations/migration-runner.js verify
                    # The same `envFrom` the backend Deployment uses: NODE_ENV, DB_NAME,
                    # DB_PRIMARY_HOST (set by the deploy above) and the rest.
                    envFrom:
                      - configMapRef:
                          name: hakawi-backend-config
                    env:
                      - name: HAKAWI_MIGRATIONS_DIR
                        value: /migrations
                      # The db router prefers DB_PRIMARY_* and falls back to DB_*
                      # (src/db/router.ts), which is why these two are enough.
                      - name: DB_USER
                        valueFrom:
                          secretKeyRef:
                            name: hakawi-backend-secrets
                            key: db.user
                      - name: DB_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: hakawi-backend-secrets
                            key: db.password
                    volumeMounts:
                      - name: migrations
                        mountPath: /migrations
                        readOnly: true
                volumes:
                  - name: migrations
                    configMap:
                      name: ${CM}
          EOF

          if ! kubectl wait --for=condition=complete "job/${JOB}" -n hakawi --timeout=600s; then
            kubectl logs "job/${JOB}" -n hakawi --all-containers --tail=200 || true
            echo "::error::the migration job failed; see its log above"
            exit 1
          fi
          kubectl logs "job/${JOB}" -n hakawi --tail=50

      - name: Deploy backend to staging
        run: |
          kubectl config use-context staging
          helm upgrade --install hakawi-staging-backend ./infrastructure/helm/backend \
            --namespace hakawi \
            --values infrastructure/helm/backend/values.yaml \
            --values infrastructure/helm/backend/values-staging.yaml \
            --set image.repository=${{ env.ECR_REGISTRY }}/hakawi/backend \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Always \
            --set env.db.primaryHost=${{ steps.tf-output.outputs.rds_primary_address }} \
            --set env.db.replicaHosts=${{ steps.tf-output.outputs.rds_replica_addresses }} \
            --set env.valkey.host=${{ steps.tf-output.outputs.elasticache_primary_endpoint }} \
            --set env.s3.bucket=${{ steps.tf-output.outputs.s3_bucket_name }} \
            --set env.aws.region=us-east-1 \
            --set externalSecrets.secretPrefix=${{ steps.tf-output.outputs.secret_prefix }} \
            --set serviceAccount.annotations.eks\.amazonaws\.com/role-arn=arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/hakawi-staging-hakawi-backend-irsa \
            --wait --timeout=300s

      - name: Deploy frontend to staging
        run: |
          kubectl config use-context staging
          helm upgrade --install hakawi-staging-frontend ./infrastructure/helm/frontend \
            --namespace hakawi \
            --values infrastructure/helm/frontend/values.yaml \
            --values infrastructure/helm/frontend/values-staging.yaml \
            --set image.repository=${{ env.ECR_REGISTRY }}/hakawi/frontend \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Always \
            --set env.db.host=${{ steps.tf-output.outputs.rds_primary_address }} \
            --set externalSecrets.secretPrefix=${{ steps.tf-output.outputs.secret_prefix }} \
            --wait --timeout=300s

      - name: Verify rollout
        run: |
          kubectl config use-context staging
          # `deployment/hakawi-backend`, because `fullnameOverride: hakawi-backend`
          # (infrastructure/helm/backend/values.yaml:11) is not overridden by values-staging.yaml.
          # The old name made every `rollout status` in this file fail with "deployment not found".
          kubectl rollout status deployment/hakawi-backend -n hakawi --timeout=180s
          kubectl rollout status deployment/hakawi-frontend -n hakawi --timeout=180s

      - name: Run smoke tests
        run: |
          kubectl config use-context staging
          kubectl wait --for=condition=available deployment/hakawi-backend -n hakawi --timeout=60s
          # These two hosts are the ones values-staging.yaml actually deploys
          # (infrastructure/helm/backend/values-staging.yaml:49 and the frontend chart's
          # values-staging.yaml:51), so they are left as they were.
          curl -sf https://staging-api.hakawi.io/api/v1/health || exit 1
          curl -sf https://staging.hakawi.io/ || exit 1

      - name: Notify (on failure)
        if: failure()
        run: |
          echo "Deployment to staging failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
