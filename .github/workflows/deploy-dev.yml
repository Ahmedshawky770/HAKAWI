name: Deploy to Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

# WHY `cancel-in-progress: false`. The dev workflow had it `true`, which is the setting that owes
# an explanation: on a throwaway branch it looks harmless, and it is what makes the muscle memory
# that ships to production. A queued deploy starts from the newer commit and skips the interrupted
# one, which is the behaviour you want everywhere a deploy happens.
concurrency:
  group: deploy-dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  # WHY the cluster name is a workflow-level variable: `modules/eks` names the cluster
  # `${var.environment}-hakawi` (terraform's own `eks_cluster_name` output), while the
  # workflows, docs and infrastructure/scripts/setup-iam.sh all say `hakawi-<env>-eks`. One
  # of the two is wrong and a wrong name here is a "cluster not found" at update-kubeconfig
  # — the preflight below therefore uses this constant to describe what it checked and the
  # post-apply kubeconfig uses the authoritative `terraform output` value. If those two ever
  # disagree, the deploy tells you instead of guessing.
  EKS_CLUSTER_NAME: hakawi-dev-eks
  # Paymob credentials. WHY they arrive as TF_VAR_* here rather than as a tfvars line:
  # modules/secrets makes an empty Paymob credential fail the APPLY for every environment
  # except dev (preconditions on the aws_secretsmanager_secret.paymob_* resources), because
  # backend/src/config/paymob.config.ts refuses to boot on an empty key and a rollout with
  # empty values is a CrashLoopBackOff discovered after the fact. They are `sensitive`, so
  # GitHub never prints them and terraform never echoes a sensitive value.
  TF_VAR_paymob_api_key: ${{ secrets.PAYMOB_API_KEY }}
  TF_VAR_paymob_merchant_id: ${{ secrets.PAYMOB_MERCHANT_ID }}
  TF_VAR_paymob_integration_id: ${{ secrets.PAYMOB_INTEGRATION_ID }}
  TF_VAR_paymob_webhook_secret: ${{ secrets.PAYMOB_HMAC_SECRET }}

jobs:
  # WHY THIS JOB EXISTS. Nothing ran before the deploy steps: a commit that failed lint, tests,
  # coverage or the migration gates was deployed anyway. `uses: ./.github/workflows/ci.yml` makes
  # the whole CI file a required job of this one, and every job below names it in `needs:`.
  #
  # No `secrets: inherit`: `ci.yml` reads none — checkout, `npm ci` from the lockfile, throwaway
  # service containers.
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [ci]
    outputs:
      backend-image: ${{ steps.backend-image.outputs.image }}
      frontend-image: ${{ steps.frontend-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/hakawi-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image
        id: backend-image
        run: |
          docker build -t $ECR_REGISTRY/hakawi/backend:${{ github.sha }} -f ./backend/Dockerfile .
          docker push $ECR_REGISTRY/hakawi/backend:${{ github.sha }}
          echo "image=$ECR_REGISTRY/hakawi/backend:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build, tag, and push frontend image
        id: frontend-image
        run: |
          docker build -t $ECR_REGISTRY/hakawi/frontend:${{ github.sha }} -f ./frontend/Dockerfile .
          docker push $ECR_REGISTRY/hakawi/frontend:${{ github.sha }}
          echo "image=$ECR_REGISTRY/hakawi/frontend:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy-dev:
    name: Deploy to Development
    needs: [ci, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy infrastructure to dev
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/hakawi-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------------------------------------------------------------------
      # PREFLIGHTS — everything that can fail, fails here, before an apply or a rollout exists.
      #
      # WHY THESE STEPS EXIST HERE TOO (dev keeps the API endpoint open with
      # `eks_cluster_endpoint_public_access_cidrs = ["0.0.0.0/0"]`, so this one should pass):
      # the three deploy workflows are one mechanism kept in step (Principle #9), and the
      # moment dev's tfvars changes to a closed list this is the step that says so before an
      # apply spends time. The staging and production copies of these steps are the ones with
      # a real failure to prevent: their `[]` CIDR list means the Kubernetes API answers
      # nobody from a GitHub-hosted runner, so their failure used to arrive at "Update
      # kubeconfig" — AFTER `terraform apply` had already closed the endpoint, mid-rollout.
      # Independently of the endpoint, `aws_subnet.cidr_block` is ForceNew
      # (infrastructure/terraform/modules/vpc/main.tf): an apply against state holding the old
      # overlapping `/28` database subnets plans a subnet destroy that fails while RDS still
      # holds ENIs — a deploy red at "Deploy infrastructure" with an AWS error nobody can act
      # on.
      # ---------------------------------------------------------------------------------------

      # WHY `kubectl auth can-i` and not `kubectl version`: the public access CIDRs are
      # enforced by the API SERVER endpoint, and only an authenticated Kubernetes API call
      # proves this runner can reach it. `aws eks describe-cluster` goes to the EKS control
      # plane and succeeds even when the endpoint is closed, which is exactly why it is not
      # the test.
      - name: "Preflight: cluster reachability"
        run: node scripts/preflight-cluster-reachability.mjs --cluster "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}" --env dev --allow-missing

      # WHY THIS RUNS BEFORE THE APPLY: `aws_subnet.cidr_block` is ForceNew, and this
      # environment's state still holds the overlapping `/28` database slices the dedicated
      # `/24` tiers replaced. Planning first turns "apply fails with DependencyViolation
      # half way through" into "this deploy is blocked, here is the one-time migration".
      - name: "Preflight: subnet replacement guard"
        run: scripts/preflight-vpc-subnet-replacement.sh dev infrastructure/terraform

      - name: Terraform apply dev
        id: tf-apply
        run: |
          cd infrastructure/terraform
          terraform init -backend-config="key=hakawi/dev/terraform.tfstate"
          terraform apply -var-file="environments/dev/terraform.tfvars" -auto-approve

      - name: Capture terraform outputs
        id: tf-output
        run: |
          cd infrastructure/terraform
          echo "rds_primary_endpoint=$(terraform output -raw rds_primary_endpoint)" >> $GITHUB_OUTPUT
          echo "rds_primary_address=$(terraform output -raw rds_primary_address)" >> $GITHUB_OUTPUT
          echo "rds_replica_addresses=$(terraform output -json rds_replica_addresses | jq -r 'join(",")')" >> $GITHUB_OUTPUT
          echo "elasticache_primary_endpoint=$(terraform output -raw elasticache_primary_endpoint)" >> $GITHUB_OUTPUT
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          # SSOT for the two values the deploy used to hardcode: the cluster name (the module
          # names it `${var.environment}-hakawi`, and a wrong name here is a cluster-not-found
          # at update-kubeconfig) and the Secrets Manager prefix, which must equal the charts'
          # `externalSecrets.secretPrefix` or every ExternalSecret fails to sync.
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
          echo "secret_prefix=$(terraform output -raw secret_prefix)" >> $GITHUB_OUTPUT

      # WHY the name comes from terraform: modules/eks names the cluster
      # `${var.environment}-hakawi` (`kubernetes`-provider-friendly), while this workflow
      # said `hakawi-dev-eks`. Both spellings appear in the repository, so the state is now
      # the tie-breaker instead of a duplicated constant.
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ steps.tf-output.outputs.eks_cluster_name }} --alias dev

      # ---------------------------------------------------------------------------------------
      # MIGRATION LEDGER PREFLIGHT. WHY it runs before the migration Job AND before the two
      # helm upgrades: drizzle-kit used to apply this schema
      # (`npx drizzle-kit migrate`, stopped at `0018_add_report_source` — 18 of 29 files), and
      # the repository's runner keeps its ledger in `drizzle_migrations` while drizzle-kit
      # keeps its own in `__drizzle_migrations`. On an environment previously migrated by
      # drizzle-kit the runner's ledger is short, so it re-applies `0019`–`0029` and dies on
      # the unguarded `ALTER TABLE "reports" ADD CONSTRAINT` in
      # `migrations/0018_add_report_source.sql` — after the rollout has started. The script
      # counts both tables, fails with the remediation, and touches nothing.
      #
      # Credentials mirror the Job's own env contract (the release ConfigMap plus the
      # ExternalSecret-synced secret `hakawi-backend-secrets`): DB_PRIMARY_HOST/PORT/NAME and
      # DB_USER/DB_PASSWORD. Nothing is printed; the password is only ever passed to the
      # script through the environment.
      - name: "Preflight: migration ledger agreement"
        run: |
          set -euo pipefail
          # WHY jq and not `-o jsonpath`: the keys this preflight needs contain dots
          # (`db.user`, `db.password`), which a jsonpath expression can only reach through
          # escaping; `jq` indexes the map literally. WHY the ConfigMap and the
          # ExternalSecret-synced secret rather than tf outputs: those are exactly the values
          # the migration Job reads below, so the preflight checks the same database with the
          # same identity the job will use. Nothing is printed — the password only ever
          # exists in this step's environment.
          CONFIG="$(kubectl get configmap hakawi-backend-config -n hakawi -o json)"
          SECRET="$(kubectl get secret hakawi-backend-secrets -n hakawi -o json)"

          export DB_PRIMARY_HOST="$(jq -r '.data.DB_PRIMARY_HOST // ""' <<<"$CONFIG")"
          export DB_PRIMARY_PORT="$(jq -r '.data.DB_PORT // "5432"' <<<"$CONFIG")"
          export DB_PRIMARY_NAME="$(jq -r '.data.DB_NAME // "hakawi"' <<<"$CONFIG")"
          export DB_USER="$(jq -r '.data["db.user"] // "" | @base64d' <<<"$SECRET")"
          export DB_PASSWORD="$(jq -r '.data["db.password"] // "" | @base64d' <<<"$SECRET")"

          if [ -z "$DB_PRIMARY_HOST" ]; then
            echo "::error::the release ConfigMap hakawi-backend-config carries no DB_PRIMARY_HOST, so the migration ledger preflight cannot reach the same primary the migration Job will use. Deploy the backend release once (or apply the chart) and re-run."
            exit 1
          fi
          if [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::the ExternalSecret-synced secret hakawi-backend-secrets has no db.user/db.password yet, so the migration ledger preflight cannot authenticate. Deploy the backend release once (or apply the chart) and re-run."
            exit 1
          fi
          node scripts/preflight-migration-ledger.mjs

      # ---------------------------------------------------------------------------------------
      # MIGRATIONS. What used to be here: `kubectl exec -n hakawi "$POD" -- npx drizzle-kit
      # migrate`, broken three ways over, and silent about all of them.
      #
      #   1. It applied the drizzle journal, which listed 18 of the 29 `.sql` files in
      #      `migrations/`. MFA support (0029) and the books-owner backfills (0019, 0025) have
      #      never reached a database. See `migrations/meta/README.md`; `scripts/
      #      check-migration-journal.mjs` now fails a pull request when the index stops matching
      #      the files, and the journal has been completed.
      #   2. `drizzle-kit` is a devDependency and the runtime image installs `--omit=dev`
      #      (backend/Dockerfile), so the binary is not in the pod, and `npx` would have to fetch
      #      it into a container with `readOnlyRootFilesystem: true`.
      #   3. `$POD` was empty: the label selector `app.kubernetes.io/name=hakawi-backend` matches
      #      nothing, because the chart sets that label to the chart name (`values.yaml:12`
      #      nameOverride: backend).
      #
      # What is here now: the repository's own runner, applied in a DISPOSABLE JOB, because that
      # is the only place it can run. RDS is `publicly_accessible = false`
      # (infrastructure/terraform/modules/rds/main.tf:94), so a GitHub runner cannot reach the
      # database; and the image ships `dist/` without `src/` or the migration files, so the job
      # mounts `migrations/` from a ConfigMap and runs the compiled entry point the image already
      # contains. Locally verified against the compose `postgres-primary`:
      # `NODE_ENV=production node backend/dist/db/migrations/migration-runner.js up
      # --allow-production` reports all 29 applied after `npm run migration:run` does, and refuses
      # to run without the flag.
      #
      # WHY IT RUNS BEFORE THE TWO `helm upgrade` STEPS: it used to run after them, so the new
      # image went live BEFORE the schema it needs existed. A migration that only the new code
      # needs (`0029_add_mfa_support` reads `mfa_secret`; `0019`/`0025` backfill the counters the
      # books code reads) then failed against an already-rolled-out release — a broken release
      # with the old image gone. The schema first, the code second. Its failure aborts the
      # rollout because it is a plain step: no `continue-on-error`, and everything after it in
      # this file is gated on it.
      - name: Apply migrations from the repository's own runner
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          CM="hakawi-migrations-${SHA}"
          JOB="hakawi-migrations-${SHA}"

          kubectl config use-context dev

          # `--dry-run=client -o yaml | kubectl apply` is the idempotent way to create or refresh a
          # ConfigMap: `create` alone fails on the second deploy of the same commit.
          kubectl create configmap "${CM}" --from-file=migrations/ -n hakawi --dry-run=client -o yaml \
            | kubectl apply -f -

          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: hakawi
            labels:
              app.kubernetes.io/name: hakawi-migrations
              app.kubernetes.io/part-of: hakawi
              app.kubernetes.io/component: migration
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: hakawi-migrations
                  app.kubernetes.io/part-of: hakawi
                  app.kubernetes.io/component: migration
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${{ env.ECR_REGISTRY }}/hakawi/backend:${{ github.sha }}
                    imagePullPolicy: Always
                    # The compiled entry point, because the image has `dist/` and not `src/`, with
                    # module specifiers already rewritten to `.js` (verified in
                    # `backend/dist/db/migrations/migration-runner.js`).
                    #
                    # `up --allow-production` is the explicit-decision form the runner demands under
                    # `NODE_ENV=production` (migration-runner.ts:535-539); `verify` rejects that
                    # flag for any command but `up` (`parseMigrationArgv`), so the ledger check
                    # drops the variable instead.
                    command:
                      - sh
                      - -c
                      - |
                        set -e
                        node dist/db/migrations/migration-runner.js up --allow-production
                        env -u NODE_ENV node dist/db/migrations/migration-runner.js verify
                    # The same `envFrom` the backend Deployment uses: NODE_ENV, DB_NAME,
                    # DB_PRIMARY_HOST (set by the deploy above) and the rest.
                    envFrom:
                      - configMapRef:
                          name: hakawi-backend-config
                    env:
                      - name: HAKAWI_MIGRATIONS_DIR
                        value: /migrations
                      # The db router prefers DB_PRIMARY_* and falls back to DB_*
                      # (src/db/router.ts), which is why these two are enough.
                      - name: DB_USER
                        valueFrom:
                          secretKeyRef:
                            name: hakawi-backend-secrets
                            key: db.user
                      - name: DB_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: hakawi-backend-secrets
                            key: db.password
                    volumeMounts:
                      - name: migrations
                        mountPath: /migrations
                        readOnly: true
                volumes:
                  - name: migrations
                    configMap:
                      name: ${CM}
          EOF

          if ! kubectl wait --for=condition=complete "job/${JOB}" -n hakawi --timeout=600s; then
            kubectl logs "job/${JOB}" -n hakawi --all-containers --tail=200 || true
            echo "::error::the migration job failed; see its log above"
            exit 1
          fi
          kubectl logs "job/${JOB}" -n hakawi --tail=50

      - name: Deploy backend to dev
        run: |
          helm upgrade --install hakawi-backend ./infrastructure/helm/backend \
            --namespace hakawi \
            --values infrastructure/helm/backend/values.yaml \
            --set image.repository=${{ env.ECR_REGISTRY }}/hakawi/backend \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Always \
            --set env.db.primaryHost=${{ steps.tf-output.outputs.rds_primary_address }} \
            --set env.db.replicaHosts=${{ steps.tf-output.outputs.rds_replica_addresses }} \
            --set env.valkey.host=${{ steps.tf-output.outputs.elasticache_primary_endpoint }} \
            --set env.s3.bucket=${{ steps.tf-output.outputs.s3_bucket_name }} \
            --set env.aws.region=us-east-1 \
            --set externalSecrets.secretPrefix=${{ steps.tf-output.outputs.secret_prefix }} \
            --set serviceAccount.annotations.eks\.amazonaws\.com/role-arn=arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/hakawi-dev-hakawi-backend-irsa \
            --wait --timeout=300s

      - name: Deploy frontend to dev
        run: |
          helm upgrade --install hakawi-frontend ./infrastructure/helm/frontend \
            --namespace hakawi \
            --values infrastructure/helm/frontend/values.yaml \
            --set image.repository=${{ env.ECR_REGISTRY }}/hakawi/frontend \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Always \
            --set env.db.host=${{ steps.tf-output.outputs.rds_primary_address }} \
            --set externalSecrets.secretPrefix=${{ steps.tf-output.outputs.secret_prefix }} \
            --wait --timeout=300s

      - name: Run smoke tests
        run: |
          # `deployment/hakawi-backend`, because `fullnameOverride: hakawi-backend`
          # (infrastructure/helm/backend/values.yaml:11) is not overridden by any values file: the
          # Deployment carries that name in every environment.
          kubectl wait --for=condition=available deployment/hakawi-backend -n hakawi --timeout=60s
          kubectl wait --for=condition=available deployment/hakawi-frontend -n hakawi --timeout=60s
          # WHY IN-CLUSTER AND NOT `curl https://api.hakawi.com`. The old probe hit
          # `https://api.hakawi.com` and `https://app.hakawi.com` — PRODUCTION's hosts
          # (infrastructure/helm/backend/values.yaml:68 and the frontend chart's
          # values.yaml:55), because dev deploys the base chart unchanged and that chart's
          # ingress hosts are production's. So the dev smoke test measured whether production
          # was up, said nothing about the commit just deployed, and failed whenever
          # production's DNS or TLS was the thing that broke. It also needed shared DNS and a
          # public ingress to be healthy for a test that is about a dev rollout.
          #
          # The probe below runs INSIDE the cluster, against the Services this release
          # actually created, so it depends on nothing outside it:
          #   * `hakawi-backend` — the backend Service, `fullnameOverride: hakawi-backend`
          #     (values.yaml:11), port 80 -> targetPort 3001 (values.yaml:51-55), health path
          #     `/api/v1/health` (values.yaml:150 `env.healthPath`).
          #   * `hakawi-frontend` — the frontend Service, `fullnameOverride: hakawi-frontend`
          #     (frontend chart values.yaml:6), port 80 -> targetPort 3000, health path
          #     `/api/health` (frontend values.yaml:123 `env.healthPath`).
          # `kubectl run --rm -i --restart=Never` is a disposable pod per probe: nothing is
          # left running in the namespace, and a failing curl is still a non-zero exit, which
          # keeps this step's failure semantics exactly as they were.
          kubectl run -n hakawi --rm -i --restart=Never curl-check-backend \
            --image=curlimages/curl:8.8.0 --quiet -- \
            curl -fsS --max-time 30 http://hakawi-backend/api/v1/health
          kubectl run -n hakawi --rm -i --restart=Never curl-check-frontend \
            --image=curlimages/curl:8.8.0 --quiet -- \
            curl -fsS --max-time 30 http://hakawi-frontend/api/health

      - name: Notify (on failure)
        if: failure()
        run: |
          echo "Deployment to dev failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
