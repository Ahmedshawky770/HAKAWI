name: Terraform CI

on:
  push:
    paths:
      - 'infrastructure/terraform/**'
    branches: [main, develop]
  pull_request:
    paths:
      - 'infrastructure/terraform/**'

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  TERRAFORM_VERSION: "1.9"

jobs:
  terraform:
    name: Terraform Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          cli-config-url: https://raw.githubusercontent.com/hashicorp/core/main/.terraformrc

      # WHY A PINNED ZIP. The tflint project deleted the `master` install script that used to
      # live at install_linux.sh, so `curl ... | bash` returned the GitHub 404 page: bash ran it
      # as input and died with `404:: command not found` before this workflow linted anything.
      # We pin an actual release and verify its published checksum instead, so a bad download
      # or a tampered asset fails the step loudly rather than leaving a broken linter on PATH.
      # `sha256sum -c` requires the checksum in `<hash>  <file>` form, hence the printf.
      - name: Setup tflint
        env:
          TFLINT_VERSION: "0.58.0"
          TFLINT_CHECKSUM: "1e8ccdf3e4b57ba154545b4343621bf46f25ca8f5cc97e36432469752f7ef0c0"
        run: |
          set -euo pipefail
          bin_dir="${RUNNER_TEMP}/tflint-bin"
          mkdir -p "${bin_dir}"
          zip="${bin_dir}/tflint.zip"
          curl -fsSL --retry 3 --retry-delay 5 \
            -o "${zip}" \
            "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          printf '%s  %s\n' "${TFLINT_CHECKSUM}" "${zip}" | sha256sum -c -
          unzip -o -q "${zip}" -d "${bin_dir}"
          chmod +x "${bin_dir}/tflint"
          echo "${bin_dir}" >> "${GITHUB_PATH}"
          "${bin_dir}/tflint" --version

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python (for tfsec)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tfsec
        run: pip install tfsec

      - name: Terraform fmt
        run: terraform fmt -recursive -check

      - name: Terraform init (dev)
        run: |
          cd infrastructure/terraform
          terraform init -backend=false

      - name: Terraform validate
        run: |
          cd infrastructure/terraform
          terraform validate

      - name: tflint
        run: tflint --recursive --force

      - name: tfsec
        run: tfsec infrastructure/terraform --soft-fail

      - name: Terraform plan (dev)
        run: |
          cd infrastructure/terraform
          terraform init -backend=false
          terraform plan -var-file="environments/dev/terraform.tfvars" -no-color

      - name: Terraform plan (staging)
        # WHY THE PAYMOB PLACEHOLDERS. `environments/staging/terraform.tfvars` deliberately
        # leaves the Paymob credentials empty: they are real payment credentials and must never
        # be written in this repository, so the deploy workflow supplies them at apply time
        # as TF_VAR_paymob_* from GitHub secrets (`.github/workflows/deploy-staging.yml`).
        # modules/secrets refuses an EMPTY one for every environment except dev — that
        # precondition exists so a deployment cannot ship a CrashLoopBackOff release — and a
        # precondition is evaluated by `terraform plan` too. CI holds no secrets and deploys
        # nothing, so without these it would fail on the very check it is trying to verify.
        #
        # These are NOT credentials and grant nothing. They are visible on purpose, in the
        # same spirit as dev's tfvars carrying obvious dev-only values: a reviewer should be
        # able to see they are placeholders, and a precondition that fires in a deploy is the
        # one that protects the environment.
        env:
          TF_VAR_paymob_api_key: ci-placeholder-not-a-paymob-key
          TF_VAR_paymob_merchant_id: ci-placeholder-not-a-merchant-id
          TF_VAR_paymob_integration_id: ci-placeholder-not-an-integration-id
          TF_VAR_paymob_webhook_secret: ci-placeholder-not-a-paymob-webhook-secret
        run: |
          cd infrastructure/terraform
          terraform plan -var-file="environments/staging/terraform.tfvars" -no-color

      - name: Terraform plan (production)
        # Same placeholder spellings, same reason (see the staging step above): CI validates
        # the wiring of every environment and holds none of their secrets, so it names
        # non-credentials and lets the deploy workflows pass the real ones.
        env:
          TF_VAR_paymob_api_key: ci-placeholder-not-a-paymob-key
          TF_VAR_paymob_merchant_id: ci-placeholder-not-a-merchant-id
          TF_VAR_paymob_integration_id: ci-placeholder-not-an-integration-id
          TF_VAR_paymob_webhook_secret: ci-placeholder-not-a-paymob-webhook-secret
        run: |
          cd infrastructure/terraform
          terraform plan -var-file="environments/production/terraform.tfvars" -no-color