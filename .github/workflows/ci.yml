name: CI/CD Pipeline

# WHY `workflow_call` ALONGSIDE THE TWO EXISTING TRIGGERS. The deploy workflows used to run
# straight from a push with nothing in front of them, so a red commit deployed. `workflow_call`
# is what lets `deploy-{dev,staging,production}.yml` name this file as their FIRST job
# (`uses: ./.github/workflows/ci.yml`) and chain everything else behind `needs: ci`. The push and
# pull_request triggers keep working exactly as before — adding a trigger is additive, and the
# `if: github.event_name == 'push' && github.ref == 'refs/heads/main'` gates below key off the
# event NAME, which a `workflow_call` event does not have (it surfaces as `github.event_name`
# `workflow_call`), so a deploy-triggered run simply runs the ungated jobs rather than
# duplicating the main-only ones.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The backend imports @hakawi/shared-types through node_modules, and that package's
      # "types" entry is ./dist/index.d.ts. dist/ is gitignored, so it must be compiled
      # before tsc can typecheck either workspace. The frontend no longer maps the package
      # to source via tsconfig "paths" — it resolves through node_modules and dist too, so
      # this step is load-bearing for the frontend typecheck as well.
      - name: Build shared-types
        run: npm run build --workspace=packages/shared-types

      - name: Lint backend (checker, no --fix)
        run: npm run lint --workspace=backend

      - name: Lint frontend
        run: npm run lint --workspace=frontend

      - name: Type check backend
        run: npm run typecheck --workspace=backend

      - name: Type check e2e harness
        run: npx tsc -p tsconfig.e2e.json --noEmit
        working-directory: backend

      # The frontend uses Next 16's route-aware global types (LayoutProps, PageProps). Next
      # writes those into .next/types/ during a build, and .next/ is gitignored, so a clean
      # runner has no such directory and `tsc --noEmit` fails with "Cannot find name
      # 'LayoutProps'" in every layout and page.
      #
      # The types are therefore GENERATED as part of the check rather than assumed to exist
      # because a developer ran `next dev` locally. Next 16 no longer runs eslint as part of
      # `next build`, so this does not duplicate the Lint frontend step above.
      - name: Generate Next route types
        run: npx next build
        working-directory: frontend

      - name: Type check frontend
        run: npm run typecheck --workspace=frontend

      - name: Type check shared-types
        run: npm run typecheck --workspace=packages/shared-types

      - name: Check formatting
        run: npm run format --workspace=backend

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hakawi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      valkey:
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test --workspace=backend

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared-types
        run: npm run build --workspace=packages/shared-types

      - name: Run frontend tests
        run: npm run test:run --workspace=frontend

      - name: Run frontend tests with coverage gate
        run: npm run test:coverage --workspace=frontend

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 14

  test-coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hakawi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      valkey:
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The gate is the vitest coverage.thresholds block in backend/vitest.config.ts
      # (global 79/70/73/78 plus nine per-path ratchets). It is a measured floor with
      # roughly two points of headroom, not an aspiration. The report below is only a
      # human-readable echo of the same thresholds; it never passes where vitest fails.
      - name: Run tests with coverage gate
        run: npm run test:cov --workspace=backend

      - name: Print coverage summary
        if: always()
        run: node backend/scripts/print-coverage-summary.mjs

      - name: Upload coverage summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: backend/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            backend/coverage/lcov.info
            backend/coverage/index.html
          if-no-files-found: warn
          retention-days: 14

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hakawi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      valkey:
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same reason as the lint job: @hakawi/shared-types resolves through node_modules, and its
      # "types" entry is ./dist/index.d.ts. dist/ is gitignored, so it must exist on a clean
      # checkout. vitest.config.e2e.ts also aliases the package to source, but building it here
      # keeps every workspace on the same artefact and keeps the job self-explanatory.
      - name: Build shared-types
        run: npm run build --workspace=packages/shared-types

      # A graph that cannot be built fails in `DependenciesScanner`, BEFORE any test body runs, so Vitest
      # tallies every test in the affected file as SKIPPED rather than failed. Measured with that
      # state reproduced: `test:e2e` exits 1 (so the job is red), but the report reads
      # `numFailedTests: 4, numPendingTests: 195` — the 195 being every real test, collected and then
      # not run. The exit code says "something broke"; the counts say what. Asserting them turns a
      # vague red into a named failure, and stops "collected but never executed" from reading like a
      # suite with nothing left to do.
      #
      # The regression this guards is in docs/adr/006-the-backend-could-not-boot.md: a books<->
      # library cycle with no forwardRef(), plus a module importing NotificationsModule without
      # listing it, meant the backend could not boot at all.
      #
      # The reporter is JSON because the default output does not expose collected/skipped counts in
      # a form a shell can assert on.
      # `npm run … --workspace=backend` runs with cwd = `backend/`, so the relative
      # `--outputFile=e2e-results.json` lands at `backend/e2e-results.json`. The assert step below
      # runs from the repository root, so it must name that path explicitly. Getting this wrong makes
      # the guard exit 2 ("unreadable report") on every push, which is a broken pipeline rather than
      # a caught regression.
      - name: Run e2e tests
        run: npm run test:e2e --workspace=backend -- --reporter=json --outputFile=e2e-results.json

      - name: Assert the e2e suite actually ran
        run: node backend/scripts/assert-suite-ran.mjs backend/e2e-results.json --min-tests 150 --max-skipped 0 --label e2e

      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: backend/e2e-results.json
          if-no-files-found: error

  # Browser tests. These drive the real Next.js dev server against the real API through
  # Chromium, so they need both, a migrated database, and the browser binaries. They were
  # previously configured and never invoked: the job below uploaded a Playwright report that
  # no step produced, behind `if-no-files-found: ignore`.
  test-browser:
    name: Browser Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hakawi_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      valkey:
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: hakawi_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres
      VALKEY_HOST: localhost
      VALKEY_PORT: '6379'
      # Non-production secrets. The API config validates a 32-character minimum, so these
      # are sized to pass validation and are worthless outside this throwaway database.
      JWT_SECRET: ci-browser-jwt-secret-value-not-used-anywhere-else
      REFRESH_TOKEN_SECRET: ci-browser-refresh-secret-value-not-used-anywhere
      ENCRYPTION_KEY: ci-browser-encryption-key-value-not-used-anywhere

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The browser specs create their own accounts and stories through the API, but they
      # need the schema to exist first. This runs the real migration runner against a
      # throwaway database, so a broken migration fails the browser job too rather than
      # being papered over by a schema push.
      - name: Apply migrations
        run: npm run migration:run --workspace=backend

      # --with-deps installs the browser plus its shared libraries. Without it the runner
      # image has no WebKit/Firefox system packages and Chromium fails to launch.
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build shared-types
        run: npm run build --workspace=packages/shared-types

      - name: Run browser tests
        run: npm run test:e2e --workspace=frontend
        working-directory: frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/coverage/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      # Traces and screenshots are the only way to diagnose a browser failure after the fact.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/coverage/playwright-test-results
          if-no-files-found: ignore
          retention-days: 7

  migration-premerge:
    name: Migration Lint (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Structural gate over migrations/*.sql and migrations/down/*.sql only: naming,
      # sequence gaps, missing or placeholder down scripts, declared reversibility that
      # does not match the statements the script actually contains. No database needed.
      - name: Check migration files
        run: npm run db:check --workspace=backend

  # WHY THIS JOB EXISTS. `migrations/meta/_journal.json` is a drizzle-kit index, not the ledger —
  # the runner orders by filename prefix and never reads it (migrations/meta/README.md). For eleven
  # migrations nothing had any reason to notice that the index had stopped describing the
  # directory: it held 18 entries against 29 `.sql` files. That stayed invisible because no tool
  # read it. Then someone pointed a deploy at it: `deploy-{dev,staging,production}.yml` ran
  # `kubectl exec … npx drizzle-kit migrate`, which applies exactly the journal's entries — so
  # every deploy applied 18 of 29 migrations, and `0029_add_mfa_support` never reached a database.
  #
  # The deploys now run the repo's own runner, which applies all 29. This guard is the second half
  # of the fix: it fails when the index stops matching the files again, so the next drift is a red
  # pull request rather than a silently skipped migration.
  migration-journal:
    name: Migration Journal Index
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # No `npm ci`: the guard is plain node over the repository's own files, so it costs a
      # checkout and nothing else. A guard that pays for a full install is a guard someone later
      # deletes to make the pipeline faster.
      - name: Assert the drizzle journal still indexes every migration file
        run: node scripts/check-migration-journal.mjs

  # From-scratch apply of the whole chain against an empty database. This is a real gate, not a
  # checksum check: it proves every migration is self-contained, runs in order on a virgin schema,
  # and is re-runnable. It deliberately does NOT claim to validate any deployed environment — it
  # has no access to one. Detecting drift between a deployed ledger and these files requires
  # running `npm run migration:verify` against that environment; see docs/data-architecture/
  # migrations/migration-runbook.md.
  migration-verify:
    name: Migration Smoke Test (from scratch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [migration-premerge]
    # `github.event_name == 'workflow_call'` is added so the gate also runs when a deploy workflow
    # calls this one: a deploy is precisely the moment a broken migration chain matters, and a
    # `workflow_call` event carries no event name of its own, so gating on 'push' alone would
    # silently skip the from-scratch apply for every deploy-triggered run.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_call'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hakawi
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run migration:run --workspace=backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: hakawi
          DB_USER: postgres
          DB_PASSWORD: postgres

      # Verifies the ledger this run just wrote: every file present, checksums intact, no orphans.
      # Together with the re-run below this is the assertion that matters — a chain that only
      # works once has a migration that is not idempotent.
      - name: Verify migration ledger
        run: npm run migration:verify --workspace=backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: hakawi
          DB_USER: postgres
          DB_PASSWORD: postgres

      - name: Re-apply migrations (idempotency)
        run: npm run migration:run --workspace=backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: hakawi
          DB_USER: postgres
          DB_PASSWORD: postgres

      - name: Verify ledger after re-apply
        run: npm run migration:verify --workspace=backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: hakawi
          DB_USER: postgres
          DB_PASSWORD: postgres

  # The `migration-verify` job above proves the UP path: apply, verify, apply again, verify. It never
  # touched a down script, so the twenty-two rollback scripts in `migrations/down/` had never been
  # executed by anything automated. That is a real gap and it is the one that bites during an incident:
  # a migration that cannot be rolled back is discovered at the moment somebody needs it.
  #
  # WHY THIS RUNS ON EVERY PULL REQUEST AND NOT ONLY ON `main`. `migration-verify` is gated on a push to
  # main because it costs a full Postgres. This one costs about two seconds of migration work — the
  # expensive part of the job is `npm ci`, which every job pays anyway. Gating the cheapest, most
  # protective job to the branch that gets five pulls a day would be the wrong trade.
  migration-roundtrip:
    name: Migration Round Trip (down and back)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [migration-premerge]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hakawi
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply every migration
        run: npm run migration:run --workspace=backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: hakawi
          DB_USER: postgres
          DB_PASSWORD: postgres

      # The count is written to the step summary rather than compared to a hard-coded number. A fixed
      # number would have to be edited on every migration, and the edit is the moment someone stops
      # reading the job.
      - name: Record the applied table count
        id: applied
        run: |
          count=$(psql "$DATABASE_URL" -tAc "select count(*) from information_schema.tables where table_schema = 'public';")
          echo "tables_after_apply=$count" >> "$GITHUB_OUTPUT"
          echo "Applied $count public tables." >> "$GITHUB_STEP_SUMMARY"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hakawi

      - name: Roll every migration back
        # `--to 0000_create_users_table` leaves 0000 applied and drops everything after it, so the
        # assertion below is about what REMAINS rather than about an empty database. `--to 0000`
        # would be a bare number and the runner resolves that as a filename, which fails the naming
        # convention — the id has to be spelled out.
        #
        # `--allow-data-loss` is not optional here and never will be: every down script in this chain is
        # classified `data-loss` because rolling a schema back necessarily destroys the rows written
        # since. The flag is the runner's way of making that explicit, and this is a throwaway CI
        # database, so the loss is the point rather than an accident.
        run: npm run migration:rollback --workspace=backend -- --to 0000_create_users_table --allow-data-loss
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: hakawi
          DB_USER: postgres
          DB_PASSWORD: postgres

      # The assertion that gives this job its teeth. `migration:status` exiting zero is not enough —
      # it reports what the LEDGER believes, and the ledger is the thing a broken down script would have
      # already marked as rolled back. Asking Postgres what tables actually exist is the independent
      # check: a down script that recorded the rollback without dropping its objects leaves the ledger
      # clean and the schema wrong, and only this sees it.
      - name: Assert the down scripts actually dropped their objects
        run: |
          set -euo pipefail
          remaining=$(psql "$DATABASE_URL" -tAc "select table_name from information_schema.tables where table_schema = 'public' order by 1;")
          echo "Tables remaining after rollback:$remaining"
          echo "Tables remaining after rollback:$remaining" >> "$GITHUB_STEP_SUMMARY"

          # `users` is 0000's own table and stays because the rollback target is 0000.
          # `drizzle_migrations` is the ledger, which the runner owns and never drops.
          expected=$'drizzle_migrations\nusers'
          if [ "$remaining" != "$expected" ]; then
            echo "::error::A down script recorded the rollback without dropping its objects."
            echo "Expected exactly 'users' and 'drizzle_migrations' to remain; got: $remaining"
            exit 1
          fi

      - name: Assert the ledger agrees
        run: |
          set -euo pipefail
          # Queried rather than parsed out of `migration:status`. The runner's log output carries ANSI
          # colour and its column spacing is a presentation choice, so `grep` over it is an assertion
          # about formatting. This asks the ledger itself, and `rolled_back_at is null` is exactly the
          # question: which migrations does this database currently believe are live?
          active=$(psql "$DATABASE_URL" -tAc "select count(*) from drizzle_migrations where rolled_back_at is null;")
          echo "Migrations the ledger considers applied: $active"
          echo "Migrations the ledger considers applied after rollback: $active" >> "$GITHUB_STEP_SUMMARY"

          if [ "$active" -ne 1 ]; then
            echo "::error::Expected exactly one live migration after rolling back to 0000, found $active."
            psql "$DATABASE_URL" -tAc "select migration_id from drizzle_migrations where rolled_back_at is null;"
            exit 1
          fi
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hakawi

      - name: Re-apply every migration
        run: npm run migration:run --workspace=backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: hakawi
          DB_USER: postgres
          DB_PASSWORD: postgres

      - name: Verify the ledger after re-apply
        run: npm run migration:verify --workspace=backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: hakawi
          DB_USER: postgres
          DB_PASSWORD: postgres

      # Same table count as the first apply, compared against the value captured then rather than a
      # literal. A forward script that is not re-runnable over a rolled-back schema shows up here as a
      # missing table, which is the failure mode the re-apply in `migration-verify` cannot see because
      # that job never removed anything.
      - name: Assert the re-applied schema matches the first apply
        run: |
          set -euo pipefail
          count=$(psql "$DATABASE_URL" -tAc "select count(*) from information_schema.tables where table_schema = 'public';")
          echo "Tables after re-apply: $count (was ${{ steps.applied.outputs.tables_after_apply }})"
          echo "Tables after re-apply: $count" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" != "${{ steps.applied.outputs.tables_after_apply }}" ]; then
            echo "::error::The re-applied schema does not match the first apply."
            echo "A forward script is not re-runnable over a rolled-back schema."
            exit 1
          fi
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hakawi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # The dev tree is audited separately, and it is allowed to fail, because the remaining
      # highs are not fixable from here and are not reachable from the application.
      #
      # The whole of `undici`'s advisory set arrives through ONE dependency: @nestjs/mau, the
      # `nest deploy` tool, which pins `undici: 6.20.1` as an exact version. An npm override
      # cannot move an exact pin, and no release of mau lifts it. The package is a devDependency,
      # is imported by nothing under backend/src, and never runs in a deployed process — it
      # only issues HTTP while a developer is deploying. The advisories are WebSocket
      # decompression DoS, Set-Cookie parsing and CRLF injection, none of which has a reachable
      # path in a tool that talks to a deploy endpoint and exits.
      #
      # `continue-on-error` with a printed audit summary rather than `|| true`, so a NEW
      # high-severity finding still appears in the log and can be acted on, and so a future
      # upgrade that clears this also clears the red X on the job. The production audit above
      # remains hard-failing and is at 0.
      - name: Audit all dependencies (dev tree, advisory only)
        run: npm audit --audit-level=high
        continue-on-error: true

  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # `migration-roundtrip` is in this list and `migration-verify` is not, deliberately and in
    # opposite directions from how they used to look:
    #
    #   - `migration-verify` is EXCLUDED because it only runs on a push to `main` (its `if:` gate).
    #     Listing a skipped job in `needs:` would make `build` permanently unsatisfiable on every pull
    #     request, so it is left out and the gap is stated in `docs/roadmap/phases/implementation-roadmap.md`.
    #   - `migration-roundtrip` is INCLUDED because it has no such gate: it runs on every pull request,
    #     costs about two seconds of migration work, and is the assertion that catches a migration
    #     which cannot be rolled back — the failure an operator meets during an incident.
    #   - `migration-journal` is INCLUDED for the same reason: no `if:` gate, no database, and it is
    #     the assertion that keeps the drizzle index from describing a directory that no longer
    #     exists. The 18-of-29 deploys it now prevents are recorded in migrations/meta/README.md.
    needs: [lint, test-unit, test-frontend, test-coverage, test-e2e, test-browser, migration-premerge, migration-roundtrip, migration-journal, security, backup-verify]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared-types
        run: npm run build --workspace=packages/shared-types

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Build frontend
        run: npm run build --workspace=frontend

  load-test:
    name: Load Test (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    if: github.ref == 'refs/heads/main'
    # WHY THESE FOUR. The job starts the compose datastores, which come up with the
    # docker-compose.yml defaults: user `postgres`, database `hakawi`, password
    # `dev-postgres-change-in-production` (docker-compose.yml:55-57). The backend and the
    # migration runner default the password to the EMPTY STRING (src/db/router.ts), so without
    # this block the migration step would fail on authentication and the backend would never
    # boot — which the broken wait loop below used to hide. Same values as `backup-verify`, for
    # the same reason: they are what this repository's compose file actually starts.
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: ${{ vars.DB_NAME || 'hakawi' }}
      DB_USER: ${{ vars.DB_USER || 'postgres' }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'dev-postgres-change-in-production' }}
      VALKEY_HOST: localhost
      VALKEY_PORT: '6379'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # WHY THE SERVICE IS `postgres-primary` AND NOT `postgres`. Commit 3e5958fb introduced the
      # read-replica architecture and renamed the single service to `postgres-primary`
      # (docker-compose.yml:52). This job still said `docker compose up -d postgres`, which fails
      # outright with `no such service: postgres` (reproduced locally), so the job — and `build`,
      # which needs it — has never run. `valkey` is here because the backend connects to it on
      # boot, not because this test reads from it.
      - name: Start datastores
        run: docker compose up -d postgres-primary valkey

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres-primary pg_isready -U "$DB_USER" >/dev/null 2>&1; then
              echo "postgres-primary is ready"
              exit 0
            fi
            sleep 1
          done
          # A wait loop that falls through on timeout is not a wait: it hands a broken datastore to
          # the next step and lets the verdict come from somewhere else. Fail here instead.
          echo "::error::postgres-primary never became ready within 30s"
          exit 1

      - name: Run migrations
        run: npm run migration:run --workspace=backend

      - name: Start backend
        run: npm run start:dev --workspace=backend &
        env:
          NODE_ENV: test
      # WHY PORT 3001 AND `/api/v1/health`. The backend listens on 3001 (the `PORT` default in
      # docker-compose.yml:208, `EXPOSE 3001` in backend/Dockerfile) and `main.ts:102` sets the
      # global prefix `api/v1`, so the reachable route is `/api/v1/health`. This loop curled
      # `http://localhost:3000/health`, which is nothing — 3000 is the FRONTEND's port and a bare
      # `/health` 404s behind the prefix — so it always exhausted its 60 attempts and then kept
      # going, letting k6 run against a server that was never up.
      # `load-tests/k6.conf.js` defaults BASE_URL to the same `http://localhost:3001/api/v1`.
      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/api/v1/health >/dev/null 2>&1; then
              echo "backend answered on http://localhost:3001/api/v1/health"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not answer on http://localhost:3001/api/v1/health within 60s"
          exit 1

      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.0
        with:
          filename: load-tests/k6.conf.js
          # BASE_URL spelled out rather than left to the script's default. `load-tests/k6.conf.js`
          # already defaults to `http://localhost:3001/api/v1`, so this is the same URL — but the
          # wait step above is the thing that proves the server is up on it, and a reader looking
          # for "which host does the load test hit" should find it here and not in a JS constant.
          flags: -e BASE_URL=http://localhost:3001/api/v1 --out json=k6-report.json

      - name: Upload k6 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-report
          path: k6-report.json
          retention-days: 14

  backup-verify:
    name: Backup Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # WHY THESE THREE VARIABLES AND NOT INVENTED ONES. `docker-compose.yml` defaults
    # `DB_USER=postgres`, `DB_PASSWORD=dev-postgres-change-in-production` and `DB_NAME=hakawi`
    # (lines 55-57), and this job runs that compose file, so these are the credentials the
    # service is actually started with. The old job passed `PGPASSWORD=postgres`, which matches
    # nothing in this stack — it only ever worked because it never reached a database with data in
    # it. `${...:-default}` keeps the value overridable by a runner-level env of the same name.
    env:
      DB_USER: ${{ vars.DB_USER || 'postgres' }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'dev-postgres-change-in-production' }}
      DB_NAME: ${{ vars.DB_NAME || 'hakawi' }}
      DB_HOST: localhost
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4

      # The job now runs the migration runner, so it needs node and the lockfile install the way
      # every other job in this file does. Without these two steps `npm run migration:run` was
      # not merely unexecuted, it was unexecutable.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # WHY `postgres-primary`. Commit 3e5958fb renamed the service (docker-compose.yml:52); the
      # old `docker compose up -d postgres` died with `no such service: postgres` (reproduced
      # locally: exit 1), which is why this job has never actually verified anything.
      - name: Start PostgreSQL
        run: docker compose up -d postgres-primary

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres-primary pg_isready -U "$DB_USER" >/dev/null 2>&1; then
              echo "postgres-primary is ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::postgres-primary never became ready within 30s"
          exit 1

      # WHY THIS STEP IS THE WHOLE POINT OF THE JOB. It used to start an EMPTY database, dump it,
      # restore the dump and count tables. The count was 0, the assertion was "it printed a
      # number", and the job passed: a backup-and-restore drill on a schema that does not exist
      # certifies nothing about the backup of anything real. Applying the migration chain first
      # means the dump contains the schema the application actually runs on, which is what
      # `scripts/backup.sh` takes of production. Measured locally: the empty-database version
      # restores 0 tables and still reports success; this version restores 35.
      #
      # The runner is the repo's own (`backend/src/db/migrations/migration-runner.ts`), applied
      # with the compose service's credentials, because a restore drill that migrates through a
      # different path than the one production uses would verify a different schema.
      - name: Apply migrations
        run: npm run migration:run --workspace=backend
        env:
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}

      # WHY THE CLIENT RUNS INSIDE THE CONTAINER. `pg_dump` refuses to talk to a server newer
      # than itself (`server version: 15.19; pg_dump version: 14.24` — reproduced locally, which
      # produced a 371-byte dump of nothing). Running the container's own client removes the
      # runner/ server version skew from the drill, and the container's `postgres` superuser is
      # already the compose service's own credentials, so no password crosses the host at all.
      - name: Create test backup
        run: |
          set -euo pipefail
          mkdir -p backups
          docker compose exec -T postgres-primary \
            pg_dump -U "$DB_USER" -d "$DB_NAME" --format=plain --no-owner --no-acl \
            | gzip > "backups/hakawi-test-$(date +%Y%m%d-%H%M%S).sql.gz"

      - name: Verify backup integrity
        run: |
          set -euo pipefail
          LATEST=$(ls -1t backups/hakawi-test-*.sql.gz | head -1)
          gunzip -t "$LATEST"
          SIZE=$(wc -c < "$LATEST")
          echo "Backup integrity: OK ($SIZE bytes)"

          # WHY A SIZE FLOOR. A gzip stream of an empty database is 371 bytes and passes
          # `gunzip -t` exactly as a real dump does. Integrity is not the same as utility: if the
          # chain ever regresses to "no migrations applied", this is the line that notices.
          if [ "$SIZE" -lt 2048 ]; then
            echo "::error::the dump is $SIZE bytes, which is an empty database, not a schema"
            exit 1
          fi

      - name: Test restore
        run: |
          set -euo pipefail
          LATEST=$(ls -1t backups/hakawi-test-*.sql.gz | head -1)
          TEST_DB="hakawi_restore_test_$(date +%s)"
          docker compose exec -T postgres-primary psql -U "$DB_USER" -d postgres -c "DROP DATABASE IF EXISTS $TEST_DB;"
          docker compose exec -T postgres-primary psql -U "$DB_USER" -d postgres -c "CREATE DATABASE $TEST_DB;"
          gunzip -c "$LATEST" | docker compose exec -T postgres-primary psql -U "$DB_USER" -d "$TEST_DB" >/dev/null

          TABLE_COUNT=$(docker compose exec -T postgres-primary psql -U "$DB_USER" -d "$TEST_DB" -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';")
          SOURCE_COUNT=$(docker compose exec -T postgres-primary psql -U "$DB_USER" -d "$DB_NAME" -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';")
          echo "Restored $TABLE_COUNT tables; the dumped database has $SOURCE_COUNT"

          # THE ASSERTION THE JOB NEVER HAD. It used to print the count and stop, so 0 was a
          # pass. Now a restore that does not reproduce the source schema is a failure, and the
          # comparison is against the database that was dumped rather than a hard-coded number,
          # which would have to be edited every time a migration adds a table.
          if [ "$TABLE_COUNT" -eq 0 ]; then
            echo "::error::the restored database has no tables; the dump or the restore is broken"
            exit 1
          fi
          if [ "$TABLE_COUNT" != "$SOURCE_COUNT" ]; then
            echo "::error::the restored schema has $TABLE_COUNT tables and the source has $SOURCE_COUNT"
            exit 1
          fi
          echo "Restore verification: OK"
          docker compose exec -T postgres-primary psql -U "$DB_USER" -d postgres -c "DROP DATABASE IF EXISTS $TEST_DB;"

      - name: Cleanup
        if: always()
        run: docker compose down -v
