name: hakawi-dev

# WHY THE APP SERVICES MOUNT THE REPOSITORY ROOT AND NOT THEIR OWN DIRECTORY.
#
# `@hakawi/shared-types` is an npm workspace at `packages/shared-types`, resolved through the ROOT
# `node_modules` into its `dist/`. The previous configuration mounted only `./backend` at `/app`, which
# put `/app` outside the workspace graph entirely: `npm install` there saw a `package.json` with no
# `workspaces` field, treated the unpublished `@hakawi/shared-types` as a registry dependency, and
# failed. Mounting `.:/app` and setting `working_dir` to the workspace subdirectory keeps npm's
# workspace resolution intact and is what makes `npm ci` install all three workspaces at once.
#
# WHY `npm ci` AND NOT `npm install`. `package-lock.json` lives at the root, so `npm ci` is both
# possible and reproducible. `npm install` would re-resolve the floating `^` ranges on every boot.
#
# WHY `migration:run` IS PART OF THE BACKEND COMMAND. Without it the stack comes up with a healthy
# PostgreSQL, a healthy Valkey and a backend whose `/health` reports `database: connected` while every
# table is absent — a green-looking deployment with no schema. The runner is idempotent (every
# statement is `IF NOT EXISTS` and the sha256 ledger skips applied files) and takes a session advisory
# lock, so running it on every start is safe.
#
# WHY node:22. CI pins Node 22 and `docs/development/setup.md` requires 20+; this file said 20.
#
# READ REPLICA ARCHITECTURE (Principle #9 - Single Source of Truth):
# - postgres-primary: accepts writes, streams WAL to replicas
# - postgres-replica-1/2: hot standby, read-only, async replication
# - pgbouncer-primary: connection pool for writes (transaction mode)
# - pgbouncer-replica: connection pool for reads (transaction mode, load balanced)
# Application routes: writes → pgbouncer-primary:6432, reads → pgbouncer-replica:6433

services:
  postgres-primary:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-postgres-change-in-production}
      POSTGRES_DB: ${DB_NAME:-hakawi}
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c synchronous_commit=off
    ports:
      - "${DB_PRIMARY_PORT:-5432}:5432"
    volumes:
      # A NAMED volume, not a host bind mount. A bind mount puts PostgreSQL's data directory on the
      # host filesystem, and if that filesystem does not support POSIX ownership changes — a network
      # share, virtiofs, some container-in-container mounts — the container cannot chown it and dies
      # on boot with `could not change permissions of directory /var/lib/postgresql/data: Operation
      # not permitted`. That is a slow, confusing failure to debug from the compose file; a named
      # volume keeps the data inside Docker's own filesystem where it always works.
      - postgres_primary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica-1:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-postgres-change-in-production}
      POSTGRES_DB: ${DB_NAME:-hakawi}
    command: >
      postgres
      -c hot_standby=on
      -c primary_conninfo='host=postgres-primary port=5432 user=${DB_USER:-postgres} password=${DB_PASSWORD:-dev-postgres-change-in-production}'
      -c primary_slot_name=replica_1_slot
      -c hot_standby_feedback=on
    volumes:
      - postgres_replica_1_data:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica-2:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-postgres-change-in-production}
      POSTGRES_DB: ${DB_NAME:-hakawi}
    command: >
      postgres
      -c hot_standby=on
      -c primary_conninfo='host=postgres-primary port=5432 user=${DB_USER:-postgres} password=${DB_PASSWORD:-dev-postgres-change-in-production}'
      -c primary_slot_name=replica_2_slot
      -c hot_standby_feedback=on
    volumes:
      - postgres_replica_2_data:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer-primary:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASES: "hakawi=host=postgres-primary port=5432 dbname=${DB_NAME:-hakawi}"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 5
      AUTH_TYPE: md5
      ADMIN_USERS: "${DB_USER:-postgres}"
      STATS_USERS: "${DB_USER:-postgres}"
    ports:
      - "${PGBOUNCER_PRIMARY_PORT:-6432}:6432"
    volumes:
      - pgbouncer_primary_etc:/etc/pgbouncer
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-p", "6432", "-U", "${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer-replica:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASES: "hakawi=host=postgres-replica-1 port=5432 dbname=${DB_NAME:-hakawi};hakawi=host=postgres-replica-2 port=5432 dbname=${DB_NAME:-hakawi}"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 40
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 5
      AUTH_TYPE: md5
      ADMIN_USERS: "${DB_USER:-postgres}"
      STATS_USERS: "${DB_USER:-postgres}"
    ports:
      - "${PGBOUNCER_REPLICA_PORT:-6433}:6432"
    volumes:
      - pgbouncer_replica_etc:/etc/pgbouncer
    depends_on:
      postgres-replica-1:
        condition: service_healthy
      postgres-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-p", "6432", "-U", "${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      # `valkey-cli`, not `redis-cli` — that is the binary the valkey image ships.
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:22-alpine
    working_dir: /app/backend
    command: >-
      sh -c "npm ci &&
             npm run build:shared-types &&
             npm run migration:run --workspace=backend &&
             npm run start:dev --workspace=backend"
    ports:
      - "${PORT:-3001}:3001"
    # These are the container-to-container addresses. The values under `ports:` above are what the
    # HOST uses, and they are different on purpose — inside the compose network PostgreSQL is always
    # `postgres-primary:5432` regardless of what `DB_PORT` is set to.
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3001}
      # Primary (writes) — direct connection for migrations, PgBouncer for app
      DB_PRIMARY_HOST: postgres-primary
      DB_PRIMARY_PORT: 5432
      DB_PRIMARY_NAME: ${DB_NAME:-hakawi}
      DB_PRIMARY_USER: ${DB_USER:-postgres}
      DB_PRIMARY_PASSWORD: ${DB_PASSWORD:-dev-postgres-change-in-production}
      # Replicas (reads) — PgBouncer for connection pooling
      DB_REPLICA_HOSTS: postgres-replica-1,postgres-replica-2
      DB_REPLICA_PORT: 5432
      DB_REPLICA_NAME: ${DB_NAME:-hakawi}
      DB_REPLICA_USER: ${DB_USER:-postgres}
      DB_REPLICA_PASSWORD: ${DB_PASSWORD:-dev-postgres-change-in-production}
      # PgBouncer endpoints (used by application router)
      PGBOUNCER_PRIMARY_HOST: pgbouncer-primary
      PGBOUNCER_PRIMARY_PORT: 6432
      PGBOUNCER_REPLICA_HOST: pgbouncer-replica
      PGBOUNCER_REPLICA_PORT: 6432
      # Legacy compatibility (migration runner uses these)
      DB_HOST: postgres-primary
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hakawi}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-dev-postgres-change-in-production}
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      # `NODE_ENV=production` makes `public-secret.ts` REFUSE these two published defaults, which is
      # the behaviour a real deployment needs and the reason a copied `.env` fails loudly rather than
      # minting forgeable tokens.
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-32-chars-min}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-local-dev-refresh-secret-change-me-32-chars}
      JWT_EXPIRY: ${JWT_EXPIRY:-15m}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - .:/app
      # Anonymous volume so the container's `node_modules` — installed from the root lockfile, with
      # the workspace symlinks in it — is not hidden by whatever the host has at that path.
      - /app/node_modules
      - /root/.npm
    depends_on:
      postgres-primary:
        condition: service_healthy
      pgbouncer-primary:
        condition: service_healthy
      pgbouncer-replica:
        condition: service_healthy
      valkey:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    command: >-
      sh -c "npm ci &&
             npm run build:shared-types &&
             npm run dev"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_ENV: ${NODE_ENV:-development}
    volumes:
      - .:/app
      - /app/node_modules
      - /root/.npm
    depends_on:
      postgres-primary:
        condition: service_healthy
      valkey:
        condition: service_healthy
      backend:
        condition: service_started

  # Behind a profile so it does not start on every `docker compose up`. It is a database GUI, not part
  # of the application, and an always-on admin console on a published port is a liability.
  adminer:
    image: adminer:latest
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres-primary
    depends_on:
      postgres-primary:
        condition: service_healthy

volumes:
  postgres_primary_data:
  postgres_replica_1_data:
  postgres_replica_2_data:
  valkey_data:
  pgbouncer_primary_etc:
  pgbouncer_replica_etc:
