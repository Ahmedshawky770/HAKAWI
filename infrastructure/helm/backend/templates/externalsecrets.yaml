{{- if .Values.externalSecrets.enabled -}}
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.secretStore.name }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
    app.kubernetes.io/managed-by: {{ .Values.externalSecrets.secretStore.managedBy | default "helm" }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.secretStore.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "backend.serviceAccountName" . }}
            namespace: {{ .Values.namespace | default .Release.Namespace }}
          secretRef:
            jwtSecret:
              name: {{ include "backend.fullname" . }}-secrets
              key: jwt.secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "backend.fullname" . }}-secrets
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
    environment: {{ .Values.env.environment | default "production" }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ include "backend.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: db.host
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/db/host
    - secretKey: db.user
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/db/user
    - secretKey: db.password
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/db/password
        property: password
    - secretKey: db.replica-hosts
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/db/replica-hosts
    - secretKey: valkey.host
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/valkey/host
    - secretKey: valkey.password
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/valkey/password
    - secretKey: jwt.secret
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/jwt/secret
    - secretKey: jwt.refresh-secret
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/jwt/refresh-secret
    - secretKey: encryption.key
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/encryption/key
    - secretKey: paymob.api-key
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/paymob/api-key
    - secretKey: paymob.merchant-id
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/paymob/merchant-id
    - secretKey: paymob.integration-id
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/paymob/integration-id
    - secretKey: paymob.webhook-secret
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/paymob/webhook-secret
    - secretKey: sentry.dsn
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/sentry/dsn
    - secretKey: s3.access-key
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/s3/access-key
    - secretKey: s3.secret-key
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/s3/secret-key
    - secretKey: email.from
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/email/from
{{- end }}