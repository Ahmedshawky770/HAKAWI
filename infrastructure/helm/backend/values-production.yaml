# Production values for hakawi-backend

replicaCount: 5

namespace: hakawi

image:
  repository: ghcr.io/hakawi-io/hakawi-backend
  pullPolicy: Always
  tag: "latest"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3001"
  # The Prometheus text-exposition route, NOT `/api/v1/health`. See the comment in values.yaml.
  prometheus.io/path: "/api/v1/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  name: backend
  type: ClusterIP
  port: 80
  targetPort: 3001
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: api.hakawi.com
      paths:
        - path: /api
          pathType: Prefix
  tls:
    - secretName: backend-tls
      hosts:
        - api.hakawi.com

resources:
  limits:
    cpu: 4000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 30
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

serviceAccount:
  create: true
  name: hakawi-backend
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/hakawi-production-hakawi-backend-irsa

env:
  nodeEnv: production
  port: 3001
  host: "https://api.hakawi.com"
  db:
    host: ""
    port: "5432"
    name: hakawi
    primaryHost: ""
    replicaHosts: ""
  valkey:
    host: ""
    port: "6379"
    password: ""
    tls: "true"
    db: "0"
  throttle:
    ttl: "60000"
    limit: "100"
  s3:
    bucket: hakawi-production-media
  aws:
    region: us-east-1
  logLevel: info
  logFormat: json
  swagger:
    enabled: false
  healthPath: /api/v1/health
  # Readiness is the dependency-aware route (/api/v1/health/ready, 503 without DB+Valkey);
  # liveness stays on the always-200 /api/v1/health. Rationale in values.yaml.
  readinessPath: /api/v1/health/ready
  corsOrigin: "https://app.hakawi.com,https://hakawi.com"
  paymob:
    environment: live
    # The merchant's own numeric ids for the card and the mobile wallet. Empty
    # is a working configuration: the gateway then asks the customer to choose
    # inside the payment frame. See values.yaml for the full note.
    cardPaymentMethodId: ""
    walletPaymentMethodId: ""
  sentry:
    dsn: ""
  emailFrom: "noreply@hakawi.com"
  trustProxy: "true"

nodeSelector:
  kubernetes.io/arch: amd64
  kubernetes.io/os: linux
  eks.amazonaws.com/capacityType: ON_DEMAND

# Probe wiring, declared per environment so the boot budget is visible where the replica count
# and resources are. Production gets a larger startup budget than staging because the image is
# bigger and the first replica of each node pays a cold start; the timeout budget is
# 10s + 60 x 5s = ~310s before the liveness probe takes over. Rationale in values.yaml.
startupProbe:
  httpGet:
    path: /api/v1/health
    port: 3001
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60
  successThreshold: 1

livenessProbe:
  httpGet:
    path: /api/v1/health
    port: 3001
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /api/v1/health/ready
    port: 3001
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 12
  successThreshold: 1

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: eks.amazonaws.com/capacityType
              operator: In
              values:
                - ON_DEMAND
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - backend
          topologyKey: kubernetes.io/hostname
  podAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - frontend
          topologyKey: kubernetes.io/hostname

tolerations:
  - key: "node.kubernetes.io/unreachable"
    operator: "Equal"
    value: "true"
    effect: "NoExecute"
    tolerationSeconds: 30

topologySpread:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

podDisruptionBudget:
  enabled: true
  minAvailable: 3

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

externalSecrets:
  enabled: true
  refreshInterval: 30m
  secretPrefix: "hakawi/production"
  secretStore:
    name: "aws-secrets-manager"
    managedBy: "helm"
    region: "us-east-1"