# Staging values for hakawi-frontend

replicaCount: 2

fullnameOverride: hakawi-frontend
nameOverride: frontend

namespace: hakawi

image:
  repository: ghcr.io/hakawi-io/hakawi-frontend
  pullPolicy: Always
  tag: "latest"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/api/health"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  name: frontend
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: staging.hakawi.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: frontend-tls
      hosts:
        - staging.hakawi.io

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

serviceAccount:
  create: false
  name: hakawi-frontend

env:
  nodeEnv: staging
  port: 3000
  host: "https://staging.hakawi.io"
  db:
    host: ""
  apiUrl: "https://staging-api.hakawi.io/api/v1"
  logLevel: info
  logFormat: json
  healthPath: /api/health
  readinessPath: /api/health
  nextTelemetryDisabled: "1"
  nextTracingDisabled: "1"

nodeSelector:
  kubernetes.io/arch: amd64
  kubernetes.io/os: linux
  eks.amazonaws.com/capacityType: ON_DEMAND

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: eks.amazonaws.com/capacityType
              operator: In
              values:
                - ON_DEMAND
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - frontend
          topologyKey: kubernetes.io/hostname

tolerations:
  - key: "node.kubernetes.io/unreachable"
    operator: "Equal"
    value: "true"
    effect: "NoExecute"
    tolerationSeconds: 30

topologySpread:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

podDisruptionBudget:
  enabled: true
  minAvailable: 1

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretPrefix: "hakawi/staging"
  secretStore:
    name: "aws-secrets-manager"
    region: "us-east-1"

livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 12
  successThreshold: 1