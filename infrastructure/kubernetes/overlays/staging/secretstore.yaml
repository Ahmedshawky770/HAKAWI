apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: hakawi
  labels:
    app.kubernetes.io/managed-by: eks
    environment: staging
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: hakawi-backend
            namespace: hakawi
        secretRef:
          jwtSecret:
            name: hakawi-staging-backend-secrets
            key: jwt.secret