# Backend values for staging deployment
namespace: hakawi

image:
  repository: ghcr.io/hakawi-io/hakawi-backend
  pullPolicy: Always
  tag: staging-latest

replicaCount: 2

env:
  nodeEnv: production
  port: 3001
  host: "https://staging-api.hakawi.io"
  db:
    host: hakawi-staging.cluster-xxxxxxxxxxxx.us-east-1.rds.amazonaws.com
    port: 5432
    name: hakawi_staging
  valkey:
    host: hakawi-staging.xxxxxx.cache.amazonaws.com
    port: 6379
    tls: true
    db: 0
  throttle:
    ttl: 60000
    limit: 100
  s3:
    bucket: hakawi-staging-media
  aws:
    region: us-east-1
  logLevel: info
  logFormat: json
  swagger:
    enabled: false
  healthPath: /health
  readinessPath: /health

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1