# Frontend values for staging deployment
namespace: hakawi

image:
  repository: ghcr.io/hakawi-io/hakawi-frontend
  pullPolicy: Always
  tag: staging-latest

replicaCount: 2

env:
  nodeEnv: production
  port: 3000
  host: "https://staging.hakawi.io"
  logLevel: info
  logFormat: json
  healthPath: /api/health
  readinessPath: /api/health
  nextTelemetryDisabled: "1"
  nextTracingDisabled: "1"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1