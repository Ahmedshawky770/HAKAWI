apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hakawi-backend-secrets
  namespace: hakawi
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: hakawi
    app.kubernetes.io/managed-by: eks
    environment: staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: hakawi-staging-backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: db.host
      remoteRef:
        key: hakawi/staging/db/host
    - secretKey: db.user
      remoteRef:
        key: hakawi/staging/db/user
    - secretKey: db.password
      remoteRef:
        key: hakawi/staging/db/password
    - secretKey: db.replica-host
      remoteRef:
        key: hakawi/staging/db/replica-host
    - secretKey: valkey.host
      remoteRef:
        key: hakawi/staging/valkey/host
    - secretKey: valkey.password
      remoteRef:
        key: hakawi/staging/valkey/password
    - secretKey: jwt.secret
      remoteRef:
        key: hakawi/staging/jwt/secret
    - secretKey: jwt.refresh-secret
      remoteRef:
        key: hakawi/staging/jwt/refresh-secret
    - secretKey: encryption.key
      remoteRef:
        key: hakawi/staging/encryption/key
    - secretKey: paymob.api-key
      remoteRef:
        key: hakawi/staging/paymob/api-key
    - secretKey: paymob.merchant-id
      remoteRef:
        key: hakawi/staging/paymob/merchant-id
    - secretKey: paymob.integration-id
      remoteRef:
        key: hakawi/staging/paymob/integration-id
    - secretKey: paymob.webhook-secret
      remoteRef:
        key: hakawi/staging/paymob/webhook-secret
    - secretKey: s3.access-key
      remoteRef:
        key: hakawi/staging/s3/access-key
    - secretKey: s3.secret-key
      remoteRef:
        key: hakawi/staging/s3/secret-key
    - secretKey: sentry.dsn
      remoteRef:
        key: hakawi/staging/sentry/dsn
    - secretKey: email.from
      remoteRef:
        key: hakawi/staging/email/from

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hakawi-frontend-secrets
  namespace: hakawi
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: hakawi
    app.kubernetes.io/managed-by: eks
    environment: staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: hakawi-staging-frontend-secrets
    creationPolicy: Owner
  data:
    - secretKey: api.url
      remoteRef:
        key: hakawi/staging/frontend/api-url