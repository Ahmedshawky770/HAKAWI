apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hakawi-prod-backend-pdb
  namespace: hakawi
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: hakawi
    environment: production
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: hakawi

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hakawi-prod-frontend-pdb
  namespace: hakawi
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: hakawi
    environment: production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/instance: hakawi