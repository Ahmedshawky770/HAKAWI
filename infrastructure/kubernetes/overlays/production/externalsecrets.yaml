apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hakawi-backend-secrets
  namespace: hakawi
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: hakawi
    environment: production
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: hakawi-prod-backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: db.host
      remoteRef:
        key: hakawi/production/db/host
    - secretKey: db.user
      remoteRef:
        key: hakawi/production/db/user
    - secretKey: db.password
      remoteRef:
        key: hakawi/production/db/password
        property: password
    - secretKey: db.replica-host
      remoteRef:
        key: hakawi/production/db/replica-host
    - secretKey: valkey.host
      remoteRef:
        key: hakawi/production/valkey/host
    - secretKey: valkey.password
      remoteRef:
        key: hakawi/production/valkey/password
    - secretKey: jwt.secret
      remoteRef:
        key: hakawi/production/jwt/secret
    - secretKey: jwt.refresh-secret
      remoteRef:
        key: hakawi/production/jwt/refresh-secret
    - secretKey: encryption.key
      remoteRef:
        key: hakawi/production/encryption/key
    - secretKey: paymob.api-key
      remoteRef:
        key: hakawi/production/paymob/api-key
    - secretKey: paymob.merchant-id
      remoteRef:
        key: hakawi/production/paymob/merchant-id
    - secretKey: paymob.integration-id
      remoteRef:
        key: hakawi/production/paymob/integration-id
    - secretKey: paymob.webhook-secret
      remoteRef:
        key: hakawi/production/paymob/webhook-secret
    - secretKey: sentry.dsn
      remoteRef:
        key: hakawi/production/sentry/dsn

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hakawi-frontend-secrets
  namespace: hakawi
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: hakawi
    environment: production
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: hakawi-prod-frontend-secrets
    creationPolicy: Owner
  data:
    - secretKey: api.url
      remoteRef:
        key: hakawi/production/frontend/api-url