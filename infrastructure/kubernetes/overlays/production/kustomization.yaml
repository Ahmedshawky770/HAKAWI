# NOTE: Production deployment uses Helm charts (see infrastructure/helm/)
# This Kustomize overlay is a fallback for manual kubectl-based deployments.
# For normal operations, use:
#   helm upgrade --install hakawi-backend ./infrastructure/helm/backend --values values-production.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - externalsecrets.yaml
  - secretstore.yaml
  - poddisruptionbudgets.yaml

namespace: hakawi

namePrefix: prod-

commonLabels:
  environment: production

images:
  - name: backend
    newTag: prod-latest
  - name: frontend
    newTag: prod-latest

replacements:
  - source:
      kind: ConfigMap
      name: hakawi-config
    targets:
      - select:
          kind: Deployment
          name: backend
        fieldPaths:
          - spec.template.spec.containers.[name=backend].env.[name=NODE_ENV].value
      - select:
          kind: Deployment
          name: frontend
        fieldPaths:
          - spec.template.spec.containers.[name=frontend].env.[name=NODE_ENV].value

patches:
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 5
    target:
      kind: Deployment
      name: backend
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 5
    target:
      kind: Deployment
      name: frontend
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "4Gi"
    target:
      kind: Deployment
      name: backend
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
    target:
      kind: Deployment
      name: frontend
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CORS_ORIGIN
          value: "https://app.hakawi.com,https://hakawi.com"
    target:
      kind: Deployment
      name: backend
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NEXT_PUBLIC_API_URL
          value: "https://api.hakawi.com/api/v1"
      - op: replace
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NEXT_PUBLIC_APP_URL
          value: "https://app.hakawi.com"
    target:
      kind: Deployment
      name: frontend
  - patch: |
      - op: replace
        path: /spec/rules/0/host
        value: api.hakawi.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.hakawi.com
    target:
      kind: Ingress
      name: backend
  - patch: |
      - op: replace
        path: /spec/rules/0/host
        value: app.hakawi.com
      - op: replace
        path: /spec/rules/1/host
        value: hakawi.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: app.hakawi.com
      - op: replace
        path: /spec/tls/0/hosts/1
        value: hakawi.com
    target:
      kind: Ingress
      name: frontend
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 5
      - op: replace
        path: /spec/maxReplicas
        value: 30
    target:
      kind: HorizontalPodAutoscaler
      name: backend
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 5
      - op: replace
        path: /spec/maxReplicas
        value: 20
    target:
      kind: HorizontalPodAutoscaler
      name: frontend
  - patch: |
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app: backend
    target:
      kind: Deployment
      name: backend
  - patch: |
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app: frontend
    target:
      kind: Deployment
      name: frontend