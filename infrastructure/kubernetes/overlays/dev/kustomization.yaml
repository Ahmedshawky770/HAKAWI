# NOTE: Dev deployment uses Helm charts (see infrastructure/helm/)
# This Kustomize overlay is a fallback for manual kubectl-based deployments.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: hakawi

namePrefix: dev-

commonLabels:
  environment: dev

images:
  - name: backend
    newTag: dev-latest
  - name: frontend
    newTag: dev-latest

replacements:
  - source:
      kind: ConfigMap
      name: hakawi-config
    targets:
      - select:
          kind: Deployment
          name: backend
        fieldPaths:
          - spec.template.spec.containers.[name=backend].env.[name=NODE_ENV].value
      - select:
          kind: Deployment
          name: frontend
        fieldPaths:
          - spec.template.spec.containers.[name=frontend].env.[name=NODE_ENV].value

patches:
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: backend
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: frontend
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
    target:
      kind: Deployment
      name: backend
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
    target:
      kind: Deployment
      name: frontend
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CORS_ORIGIN
          value: "https://dev.hakawi.com,http://localhost:3000"
    target:
      kind: Deployment
      name: backend