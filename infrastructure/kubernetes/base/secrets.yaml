apiVersion: v1
kind: Secret
metadata:
  name: hakawi-secrets
  namespace: hakawi
type: Opaque
stringData:
  # Database - Primary
  db-primary-host: REPLACE_DB_PRIMARY_HOST
  db-primary-user: REPLACE_DB_PRIMARY_USER
  db-primary-password: REPLACE_DB_PRIMARY_PASSWORD
  # Database - Replicas
  db-replica-hosts: REPLACE_DB_REPLICA_HOSTS
  db-replica-user: REPLACE_DB_REPLICA_USER
  db-replica-password: REPLACE_DB_REPLICA_PASSWORD
  # PgBouncer
  pgbouncer-primary-host: REPLACE_PGBOUNCER_PRIMARY_HOST
  pgbouncer-replica-host: REPLACE_PGBOUNCER_REPLICA_HOST
  # Valkey
  valkey-host: REPLACE_VALKEY_HOST
  valkey-password: REPLACE_VALKEY_PASSWORD
  # JWT & Encryption
  jwt-secret: REPLACE_JWT_SECRET
  refresh-token-secret: REPLACE_REFRESH_TOKEN_SECRET
  encryption-key: REPLACE_ENCRYPTION_KEY
  # Paymob
  paymob-api-key: REPLACE_PAYMOB_API_KEY
  paymob-merchant-id: REPLACE_PAYMOB_MERCHANT_ID
  paymob-integration-id: REPLACE_PAYMOB_INTEGRATION_ID
  paymob-webhook-secret: REPLACE_PAYMOB_WEBHOOK_SECRET
  # S3
  s3-bucket: REPLACE_S3_BUCKET
  s3-region: REPLACE_S3_REGION
  s3-access-key: REPLACE_S3_ACCESS_KEY
  s3-secret-key: REPLACE_S3_SECRET_KEY
  # Sentry
  sentry-dsn: REPLACE_SENTRY_DSN
  # Email
  email-from: REPLACE_EMAIL_FROM
  # CORS
  cors-origin: REPLACE_CORS_ORIGIN