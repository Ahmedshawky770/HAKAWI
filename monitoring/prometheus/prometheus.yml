global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'hakawi'
    environment: '${ENVIRONMENT:-production}'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Hakawi Backend API
  - job_name: 'hakawi-backend'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['backend:3001']
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'hakawi-backend'

  # Hakawi Frontend (if exposing metrics)
  - job_name: 'hakawi-frontend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['frontend:3000']
    scrape_interval: 30s

  # Valkey (Redis) Exporter
  - job_name: 'valkey'
    static_configs:
      - targets: ['valkey-exporter:9121']
    scrape_interval: 30s

  # PostgreSQL Exporter
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Node Exporter (host metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s